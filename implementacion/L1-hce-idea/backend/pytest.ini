[pytest]
# `pytest -q` desde la carpeta del backend, tal como lo documentan README.md y
# CLAUDE.md. Sin esto, pytest no agrega el backend a sys.path (los tests viven en
# tests/ y no hay paquete instalado) y `conftest.py` muere con
# "ModuleNotFoundError: No module named 'app'" salvo que cada uno exporte
# PYTHONPATH a mano en su máquina. Detectado en M12.0 (2026-08-14).
pythonpath = .
testpaths = tests
