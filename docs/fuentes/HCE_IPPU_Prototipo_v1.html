}
function agregarReg(id,org){
  const f=document.getElementById(org+'_f').value, t=document.getElementById(org+'_t').value;
  if(!f||!t){alert('Complete fecha y detalle.');return;}
  const p=getP(id);
  if(org==='inau') p.inau.envios.push({fecha:f, txt:t}); else p.bps.gestiones.push({fecha:f, txt:t});
  setMod('org');
}

/* ============ VISTA: GRUPOS DE REFERENCIA ============ */
function vGrupos(sel){
  const nombres=[...new Set(DB.pacientes.map(p=>p.grupo).filter(g=>g && g!=='(asignar)'))];
  if(sel && nombres.includes(sel)) return vGrupoDetalle(sel);
  const cards = nombres.map(g=>{
    const miembros=DB.pacientes.filter(p=>p.grupo===g);
    const dupla=miembros.find(p=>p.psicologa)||{};
    const nf=(GRUPOS_FOTOS[g]||[]).length;
    return `<div class="card"><h3><a href="#/grupos/${encodeURIComponent(g)}">${g}</a></h3>
    <div class="hint">Técnicos responsables: ${dupla.psicologa||'—'} · ${dupla.maestra||'—'}</div>
    <table style="margin-top:8px"><tbody>${miembros.map(p=>`<tr><td><a href="#/pacientes/${p.id}">${p.nombre}</a></td><td class="num">${pipeline(p).filter(s=>s.st==='firmado').length}/5</td></tr>`).join('')}</tbody></table>
    <div class="hint" style="margin-top:6px">${miembros.length} integrante(s) · ${nf} foto(s) grupal(es)</div>
    <a class="btn ghost" style="padding:6px 14px;margin-top:8px" href="#/grupos/${encodeURIComponent(g)}">Abrir grupo</a></div>`;
  }).join('');
  return `
  <div class="crumb">Servicio de Atención Diurna</div>
  <div class="pagehead"><div><h2>Grupos de referencia</h2>
  <p>La atención del Servicio de Atención Diurna se organiza en grupos: el grupo es la unidad de intervención y de planificación (Manual, §2). Desde aquí se accede a la HCE de cada integrante y al registro fotográfico grupal.</p></div></div>
  <div class="grid2">${cards || '<div class="notice n-info">No hay grupos con integrantes asignados.</div>'}</div>`;
}
function vGrupoDetalle(g){
  const miembros=DB.pacientes.filter(p=>p.grupo===g);
  const dupla=miembros.find(p=>p.psicologa)||{};
  const fotos=(GRUPOS_FOTOS[g]||[]);
  const todosAutorizan = miembros.length>0 && miembros.every(p=>p.fotoConsent);
  const rows=miembros.map(p=>{
    const pl=pipeline(p).map(s=>'<span class="badge '+({firmado:'b-firmado',borrador:'b-borrador',bloqueado:'b-bloqueado'})[s.st]+'">'+s.code.replace('HCE-','')+'</span>').join(' ');
    return `<tr><td><a href="#/pacientes/${p.id}"><b>${p.nombre}</b></a><div class="hint">${p.hc} · CI ${p.ci||'—'}</div></td><td>${p.cie11}<div class="hint">${p.nivel}</div></td><td>${pl}</td><td>${p.fotoConsent?'<span class="badge b-firmado">Imagen: sí</span>':'<span class="badge b-alerta">Imagen: no</span>'}</td></tr>`;
  }).join('');
  return `
  <div class="crumb"><a href="#/grupos">Grupos de referencia</a> / ${g}</div>
  <div class="pagehead"><div><h2>${g}</h2>
  <p>Técnicos responsables: ${dupla.psicologa||'—'} · ${dupla.maestra||'—'} · ${miembros.length} integrante(s)</p></div></div>
  <div class="card"><h3>Integrantes y estado del ciclo</h3>
  <table><thead><tr><th>NNA</th><th>CIE-11 · Soporte</th><th>CI · LB · PA · PB · IC</th><th>Uso de imagen</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="card"><h3>Técnicos autorizados del grupo</h3>
  <div class="hint" style="margin-bottom:8px">Los técnicos responsables acceden a la HCE completa de los integrantes del grupo. Los demás técnicos habilitados acceden únicamente a los campos de texto libre donde participan (Manual, §21.1). Esta nómina la administra coordinación.</div>
  <table><thead><tr><th>Profesional</th><th>Rol / disciplina</th><th>Alcance</th><th></th></tr></thead><tbody>
  <tr><td>${dupla.psicologa||'—'}</td><td>Técnico/a responsable 1</td><td>HCE completa del grupo · firma</td><td></td></tr>
  <tr><td>${dupla.maestra||'—'}</td><td>Técnico/a responsable 2</td><td>HCE completa del grupo · firma</td><td></td></tr>
  ${equipoDe(g).otros.map((o,i)=>`<tr><td>${o.n}</td><td>${o.d}</td><td>${o.a}</td><td><a href="javascript:void(0)" onclick="quitarTecnico('${g.replace(/'/g,"\\'")}',${i})" style="color:var(--danger)">Quitar</a></td></tr>`).join('')}
  </tbody></table>
  <div class="uprow no-print">
    <div><label>Nombre del profesional</label><input type="text" id="eq_n"></div>
    <div><label>Disciplina</label><input type="text" id="eq_d" placeholder="Fonoaudiología, T.O., Psicomotricidad…"></div>
    <div style="flex:0"><button class="btn" onclick="agregarTecnico('${g.replace(/'/g,"\\'")}')">Autorizar</button></div>
  </div></div>
  <div class="card"><h3>Registro fotográfico grupal</h3>
  ${todosAutorizan? `<div class="notice n-ok">Todas las familias del grupo registran autorización de uso de imagen. Se habilita la carga de fotografías grupales.</div>
  <div class="uprow no-print">
    <div><label>Fotografía grupal</label><input type="file" id="gf_file" accept="image/*"></div>
    <div><label>Descripción / actividad</label><input type="text" id="gf_desc" placeholder="Ej.: salida didáctica, taller de música…"></div>
    <div style="flex:0"><button class="btn" onclick="subirFotoGrupo('${g.replace(/'/g,"\\'")}')">Cargar</button></div>
  </div>`
  : `<div class="notice n-warn"><b>Carga deshabilitada:</b> para publicar fotografías grupales, <u>todas</u> las familias de los NNA que aparecen en la imagen deben tener registrada la autorización de uso de imagen en su HCE (art. 11, CNA — Ley N.º 17.823). Integrantes sin autorización: ${miembros.filter(p=>!p.fotoConsent).map(p=>p.nombre).join('; ')||'—'}.</div>`}
  <div class="thumbs">${fotos.length? fotos.map((ft,i)=>`<div class="thumb"><img src="${ft.url}" alt=""><div class="cap">${ft.desc||'Sin descripción'} · ${ft.fecha}<br><a href="javascript:void(0)" onclick="quitarFotoGrupo('${g.replace(/'/g,"\\'")}',${i})" style="color:var(--danger)">Quitar</a></div></div>`).join('') : '<div class="notice n-info" style="margin-top:10px">Sin fotografías grupales registradas.</div>'}</div></div>`;
}
function subirFotoGrupo(g){
  const inp=document.getElementById('gf_file'), desc=document.getElementById('gf_desc').value;
  if(!inp.files.length){alert('Seleccione una imagen.');return;}
  (GRUPOS_FOTOS[g]=GRUPOS_FOTOS[g]||[]).push({url:URL.createObjectURL(inp.files[0]), desc, fecha:new Date().toISOString().slice(0,10)});
  location.hash='#/grupos/'+encodeURIComponent(g); route();
}
function quitarFotoGrupo(g,i){ if(confirm('¿Quitar esta fotografía grupal?')){ GRUPOS_FOTOS[g].splice(i,1); route(); } }
function agregarTecnico(g){
  const n=document.getElementById('eq_n').value, d=document.getElementById('eq_d').value;
  if(!n||!d){alert('Complete nombre y disciplina.');return;}
  equipoDe(g).otros.push({n, d, a:'Aportes en campos de texto libre de PA, PB e IC'});
  route();
}
function quitarTecnico(g,i){ if(confirm('¿Retirar la autorización de este técnico? (En el sistema definitivo queda registrado en la auditoría.)')){ equipoDe(g).otros.splice(i,1); route(); } }

/* ============ HCE-VF: VALORACIÓN FUNCIONAL (BUND / CIF) ============ */
// Categorización según los rangos del baremo (escala de calificadores universales
// de la CIF sobre la que se construye el BUND). Verificar contra la reglamentación
// vigente del Consejo Asesor al momento de implementar (Ley 20.378 · Decreto 72/025).
const BUND_CATS = [
 {min:0,  max:4,   cat:'Sin discapacidad', rango:'0% a 4%',   imp:'Observación preventiva.'},
 {min:5,  max:24,  cat:'Leve',             rango:'5% a 24%',  imp:'Requiere adaptaciones menores.'},
 {min:25, max:49,  cat:'Moderado',         rango:'25% a 49%', imp:'Habilita acceso a prestaciones y amparo en cuota laboral.'},
 {min:50, max:95,  cat:'Severo',           rango:'50% a 95%', imp:'Requiere apoyos significativos y permanentes.'},
 {min:96, max:100, cat:'Muy severo',       rango:'96% a 100%',imp:'Configura situación de dependencia; apoyo integral.'}
];
function bundCat(pct){
  const n=parseFloat(pct); if(isNaN(n)) return null;
  return BUND_CATS.find(c=>n>=c.min && n<=c.max) || null;
}
const VF_DOMINIOS = [
 ['comunicacion','Comunicación (comprender y expresarse, con o sin apoyos)','CIF d310–d360'],
 ['autocuidado','Autocuidado (alimentación, higiene, vestido)','CIF d510–d570'],
 ['movilidad','Movilidad y desplazamientos','CIF d450–d470'],
 ['aprendizaje','Aprendizaje y aplicación del conocimiento','CIF d110–d179'],
 ['interacciones','Interacciones y relaciones interpersonales','CIF d710–d799'],
 ['comunidad','Vida doméstica, comunitaria y uso de servicios','CIF d610–d699 · d910–d999']
];
const VF_NIVELES = ['','Autónomo','Apoyo ocasional','Apoyo frecuente','Apoyo permanente'];
// Guía orientativa de prestaciones — informativa, no vinculante
const PRESTACIONES = [
 {n:'Registro Nacional de Personas con Discapacidad (RNPcD)', o:'MIDES', d:'Inscripción voluntaria a partir de la valoración con el BUND. Puerta de entrada a prestaciones y programas.'},
 {n:'Ayuda Extraordinaria (AYEX)', o:'BPS', d:'Contribución para la concurrencia a institutos habilitados (como IPPU). Se gestiona y se sigue desde HCE-ORG.'},
 {n:'Asignación Familiar por discapacidad', o:'BPS', d:'Prestación económica; puede corresponder duplicación según la situación. Requiere valoración vigente.'},
 {n:'Pensión por invalidez', o:'BPS', d:'Para situaciones de discapacidad severa según baremo y condiciones del hogar. Resolución exclusiva de BPS.'},
 {n:'Asistentes personales', o:'Sistema Nacional Integrado de Cuidados (MIDES)', d:'Para situaciones de dependencia severa, según valoración del Sistema de Cuidados.'},
 {n:'Transporte accesible / boleto', o:'Intendencias · MTOP', d:'Beneficios de transporte según normativa departamental y nacional.'},
 {n:'Cuota laboral (4% en el Estado · Ley 19.691 en el sector privado)', o:'ONSC · MTSS', d:'Relevante para adolescentes y jóvenes en transición a la vida adulta; requiere inscripción en el RNPcD.'},
 {n:'Apoyos a la inclusión educativa', o:'ANEP · MEC', d:'Adaptaciones curriculares, acompañamiento y protocolos de inclusión según normativa educativa vigente.'}
];
function mVF(p){
  const V=p.vf; const cat=bundCat(V.pct);
  const catBadge = cat? `<span class="badge ${cat.cat==='Sin discapacidad'?'b-firmado':(cat.cat==='Leve'||cat.cat==='Moderado'?'b-borrador':'b-alerta')}" style="font-size:.85rem">${cat.cat} · ${cat.rango}</span>` : '<span class="hint">Ingrese el porcentaje de la valoración oficial</span>';
  const menor2 = false; // en el sistema real: calcular desde fecha de nacimiento
  return `
  <div class="notice n-info"><b>Enfoque de este módulo:</b> la valoración oficial de la discapacidad la realizan los equipos habilitados (MSP, MIDES, BPS) mediante el Baremo Único Nacional de Discapacidad — BUND (Ley N.º 20.378 · Decreto 72/025), sobre la base de tres instrumentos: Informe Biomédico Funcional (IBMF), Informe de Redes Sociales y Apoyos (IRSA) y el propio BUND. <b>IPPU no certifica discapacidad:</b> aquí se registra la valoración oficial, se sintetiza el perfil funcional en clave CIF (capacidades, autonomía, barreras y apoyos) y se orienta a la familia sobre las prestaciones existentes.</div>

  <div class="card"><h3>Valoración oficial (BUND) — registro</h3>
  <div class="frow">
    <div><label>Estado de la valoración</label><select onchange="getP('${p.id}').vf.estado=this.value; setMod('vf')">${['No iniciado','En trámite','Valorado','A revalorar'].map(c=>'<option '+(V.estado===c?'selected':'')+'>'+c+'</option>').join('')}</select></div>
    <div><label>Fecha de valoración</label><input type="date" value="${V.fecha}" onchange="getP('${p.id}').vf.fecha=this.value"></div>
    <div><label>Organismo / equipo valorador</label><input type="text" value="${V.organismo}" onchange="getP('${p.id}').vf.organismo=this.value"></div>
    <div><label>Porcentaje de discapacidad (%)</label><input type="number" min="0" max="100" value="${V.pct}" onchange="getP('${p.id}').vf.pct=this.value; setMod('vf')"></div>
    <div><label>Vigencia / próxima revisión</label><input type="date" value="${V.vigencia}" onchange="getP('${p.id}').vf.vigencia=this.value"></div>
    <div><label>N.º RNPcD (si está inscripto)</label><input type="text" value="${V.rnpcd}" onchange="getP('${p.id}').vf.rnpcd=this.value"></div>
  </div>
  <div style="margin:8px 0">Categoría según baremo: ${catBadge}${cat? '<div class="hint" style="margin-top:4px">Implicancia práctica orientativa: '+cat.imp+'</div>':''}</div>
  <div class="hint">La constancia de valoración se adjunta en HCE-DOC (categoría «Autorización / consentimiento» u «Otro»). En menores de 2 años no se aplica el BUND: la constancia se emite en base a IBMF e IRSA. Terminología institucional: «severo / muy severo» — la nomenclatura oficial del instrumento puede diferir; en pantallas e informes de IPPU se usa siempre la institucional.</div>
  <div class="notice n-warn" style="margin-top:10px"><b>Salvaguarda metodológica:</b> los puntajes del IDEA y de la Escala IPPU-TEA <u>no se convierten ni se traducen</u> al porcentaje del baremo. Miden constructos distintos (perfil del espectro y progreso clínico vs. porcentaje de discapacidad con factores contextuales). Este módulo nunca autocalcula la categoría desde los instrumentos clínicos.</div></div>

  <div class="card"><h3>Perfil funcional en clave CIF — capacidades, autonomía, barreras y apoyos</h3>
  <div class="hint" style="margin-bottom:10px">Síntesis breve y en lenguaje de capacidades, coherente con el modelo social de la discapacidad (Convención — Ley N.º 18.418). Sirve a la planificación del equipo y como insumo cuando la familia gestiona el IBMF y el IRSA: evita empezar de cero ante cada organismo. No duplica los instrumentos clínicos.</div>
  <table><thead><tr><th>Dominio de la vida diaria</th><th>Referencia CIF</th><th style="width:200px">Nivel de autonomía actual</th></tr></thead><tbody>
  ${VF_DOMINIOS.map(([k,n,ref])=>`<tr><td>${n}</td><td class="hint">${ref}</td><td><select onchange="getP('${p.id}').vf.dominios.${k}=this.value">${VF_NIVELES.map(x=>'<option '+(V.dominios[k]===x?'selected':'')+'>'+(x||'— sin registrar —')+'</option>').join('')}</select></td></tr>`).join('')}
  </tbody></table>
  <div class="frow" style="margin-top:12px">
    <div style="grid-column:1/-1"><label>Capacidades y fortalezas (qué puede, qué disfruta, qué lo motiva)</label><textarea onchange="getP('${p.id}').vf.capacidades=this.value">${V.capacidades}</textarea></div>
    <div style="grid-column:1/-1"><label>Barreras del entorno (físicas, comunicacionales, actitudinales, de servicios)</label><textarea onchange="getP('${p.id}').vf.barreras=this.value">${V.barreras}</textarea></div>
    <div style="grid-column:1/-1"><label>Apoyos y facilitadores existentes (personas, productos de apoyo, servicios, prestaciones)</label><textarea onchange="getP('${p.id}').vf.apoyos=this.value">${V.apoyos}</textarea></div>
    <div style="grid-column:1/-1"><label>Observaciones (consultas de la familia, gestiones en curso)</label><textarea onchange="getP('${p.id}').vf.obs=this.value">${V.obs}</textarea></div>
    <div style="grid-column:1/-1"><label>Síntesis funcional descriptiva (base del reporte a la familia — editable)</label><textarea style="min-height:120px" onchange="getP('${p.id}').vf.sintesisFuncional=this.value">${V.sintesisFuncional||''}</textarea></div>
  </div>
  <div class="toolbar">
    <button class="btn ghost" onclick="genVFBorrador('${p.id}')">Autogenerar borrador desde IDEA y protocolos</button>
    <a class="btn" href="#/reportes/vf/${p.id}">Ver / imprimir reporte para la familia</a>
  </div>
  <div class="hint">El borrador se construye <b>solo con lenguaje descriptivo</b> a partir de los instrumentos ya firmados (perfil IDEA por escala y evolución de los protocolos), y sugiere niveles de autonomía únicamente en los tres dominios con correlato clínico directo (comunicación, interacciones, aprendizaje) — siempre como propuesta editable que el equipo revisa. Los dominios sin correlato instrumental (autocuidado, movilidad, vida comunitaria) quedan a criterio del equipo. Nada de esto genera porcentajes ni categorías del baremo.</div></div>

  <div class="card"><h3>Guía orientativa para la familia — prestaciones y beneficios en Uruguay</h3>
  <div class="hint" style="margin-bottom:10px">Información de orientación general para acompañar a la familia. El otorgamiento de cada prestación es resolución exclusiva del organismo competente y depende de la valoración vigente y de los requisitos de cada trámite. Las gestiones concretas de INAU y BPS se registran en HCE-ORG.</div>
  <table><thead><tr><th>Categoría del baremo</th><th>Rango</th><th>Implicancia práctica orientativa</th></tr></thead><tbody>
  ${BUND_CATS.map(c=>`<tr ${cat && cat.cat===c.cat? 'style="background:var(--brand-tint)"':''}><td><b>${c.cat}</b></td><td class="num">${c.rango}</td><td>${c.imp}</td></tr>`).join('')}
  </tbody></table>
  <table style="margin-top:14px"><thead><tr><th>Prestación / beneficio</th><th>Organismo</th><th>Orientación</th></tr></thead><tbody>
  ${PRESTACIONES.map(x=>`<tr><td><b>${x.n}</b></td><td>${x.o}</td><td class="hint">${x.d}</td></tr>`).join('')}
  </tbody></table>
  <div class="hint" style="margin-top:8px">Esta guía es contenido informativo estático mantenido por coordinación (revisión anual sugerida, junto con la revisión del sistema). No genera trámites ni expedientes dentro de la HCE: la HCE orienta, los organismos resuelven.</div></div>`;
}

/* ============ HCE-VF: AUTOGENERACIÓN DESCRIPTIVA Y REPORTE FAMILIAR ============ */
// Lecturas descriptivas neutras por escala del IDEA (severidad relativa 0–24)
function descAfect(v){
  if(v>=16) return 'es actualmente el área donde más apoyo necesita';
  if(v>=8)  return 'requiere apoyos de manera habitual';
  return 'se encuentra relativamente preservada, con apoyos puntuales';
}
function sugiereNivel(v){ // sugerencia editable de autonomía a partir de la severidad relativa
  if(v>=16) return 'Apoyo frecuente';
  if(v>=8)  return 'Apoyo ocasional';
  return 'Autónomo';
}
function descDelta(d){
  if(d>=7)  return 'mostró avances claros y sostenidos durante el año';
  if(d>=1)  return 'mostró avances, todavía en consolidación';
  if(d===0) return 'se mantuvo estable, lo que en varias situaciones constituye en sí mismo un logro';
  if(d>=-6) return 'presentó algunas dificultades que el equipo está acompañando de cerca';
  return 'presentó un retroceso que motivó una revisión del plan de trabajo junto a la familia';
}
const VF_NOMBRE_ESC = ['la relación con otras personas','la comunicación','el manejo de los cambios y las rutinas','el juego, la imitación y la imaginación'];
function deArea(n){ return n.startsWith('el ')? 'del '+n.slice(3) : 'de '+n; }
function genVFBorrador(id){
  const p=getP(id); const V=p.vf;
  if(p.idea.estado!=='firmado'){ alert('Para autogenerar el borrador se necesita al menos la línea base IDEA firmada.'); return; }
  if((V.sintesisFuncional||'').trim() && !confirm('Ya existe una síntesis funcional. ¿Reemplazarla por un nuevo borrador autogenerado? (La versión actual se perderá.)')) return;
  const ti=ideaTotales(p.idea.punt);
  // Orden descriptivo: de mayor fortaleza relativa a mayor necesidad de apoyo
  const orden=[0,1,2,3].sort((a,b)=>ti.esc[a]-ti.esc[b]);
  let txt='PERFIL ACTUAL. ';
  txt+='En la evaluación inicial del equipo, '+VF_NOMBRE_ESC[orden[0]]+' aparece como el área de mayor fortaleza relativa, mientras que '+VF_NOMBRE_ESC[orden[3]]+' '+descAfect(ti.esc[orden[3]])+'. ';
  txt+=[1,2].map(i=>'El área '+deArea(VF_NOMBRE_ESC[orden[i]])+' '+descAfect(ti.esc[orden[i]])+'.').join(' ');
  if(p.protA.estado==='firmado' && p.protB.estado==='firmado'){
    const ta=protTotales(p.protA.punt), tb=protTotales(p.protB.punt);
    txt+='\n\nEVOLUCIÓN DEL AÑO. ';
    txt+= [0,1,2,3].map(i=>'En '+VF_NOMBRE_ESC[i]+' '+descDelta(tb.esc[i]-ta.esc[i])+'.').join(' ');
  } else if(p.protA.estado==='firmado'){
    txt+='\n\nEVOLUCIÓN DEL PRIMER SEMESTRE. El equipo registró el primer seguimiento semestral; la evolución completa del año se describirá al cierre del segundo semestre.';
  }
  txt+='\n\n(Nota del equipo: este texto fue generado como borrador descriptivo a partir de los instrumentos clínicos firmados y debe ser revisado, ajustado y completado por los técnicos responsables antes de compartirse.)';
  V.sintesisFuncional=txt;
  // Sugerencias de autonomía solo en dominios con correlato clínico y solo si están vacíos
  if(!V.dominios.comunicacion) V.dominios.comunicacion=sugiereNivel(ti.esc[1]);
  if(!V.dominios.interacciones) V.dominios.interacciones=sugiereNivel(ti.esc[0]);
  if(!V.dominios.aprendizaje) V.dominios.aprendizaje=sugiereNivel(ti.esc[3]);
  setMod('vf');
}

function vReporteVF(p){
  const V=p.vf; const cat=bundCat(V.pct);
  const doms = VF_DOMINIOS.filter(([k])=>V.dominios[k]).map(([k,n])=>`<tr><td>${n.split(' (')[0]}</td><td><b>${V.dominios[k]}</b></td></tr>`).join('');
  let evol='';
  if(p.protA.estado==='firmado' && p.protB.estado==='firmado'){
    const ta=protTotales(p.protA.punt), tb=protTotales(p.protB.punt);
    evol = [0,1,2,3].map(i=>`<p style="margin-bottom:6px"><b>${VF_NOMBRE_ESC[i].charAt(0).toUpperCase()+VF_NOMBRE_ESC[i].slice(1)}:</b> ${descDelta(tb.esc[i]-ta.esc[i])}.</p>`).join('');
  }
  return `
  <div class="crumb no-print"><a href="#/reportes">Reportes</a> / Reporte de Valoración Funcional</div>
  <div class="toolbar no-print"><button class="btn" onclick="window.print()">Imprimir / guardar PDF</button>
  <a class="btn ghost" href="#/pacientes/${p.id}">Volver a la HCE</a></div>
  <div class="card">
    <div style="border-bottom:3px solid var(--brand); padding-bottom:12px; margin-bottom:14px">
      <h2 style="font-size:1.3rem">FUNDACIÓN IPPU · Instituto Psico Pedagógico Uruguayo</h2>
      <div class="hint">INAU · MSP · BPS · ECOSOC/ONU · Montevideo, Uruguay</div>
      <h3 style="margin-top:10px">Reporte de Valoración Funcional — documento descriptivo y orientativo</h3>
    </div>
    <div class="frow">
      <div><label>Nombre</label><div>${p.nombre}</div></div>
      <div><label>Historia Clínica</label><div>${p.hc}</div></div>
      <div><label>Grupo de referencia</label><div>${p.grupo}</div></div>
      <div><label>Fecha del reporte</label><div>${new Date().toISOString().slice(0,10)}</div></div>
    </div>
    <div class="notice n-info">Este reporte describe capacidades, autonomía, barreras y apoyos con el fin de acompañar a la familia en la planificación cotidiana y en la gestión de prestaciones. <b>No es un certificado de discapacidad ni un informe clínico:</b> la valoración oficial corresponde a los equipos habilitados mediante el Baremo Único Nacional (Ley N.º 20.378), y el documento clínico anual es el Informe de Cierre de la HCE.</div>
  </div>
  ${(V.capacidades||'').trim()? `<div class="card"><h3>Capacidades y fortalezas</h3><p>${V.capacidades}</p></div>`:''}
  ${(V.sintesisFuncional||'').trim()? `<div class="card"><h3>Perfil funcional descriptivo</h3>${V.sintesisFuncional.split('\n').filter(x=>x.trim()).map(x=>'<p style="margin-bottom:8px">'+x+'</p>').join('')}</div>`:''}
  ${evol? `<div class="card"><h3>Evolución del año en palabras</h3>${evol}<div class="hint">Descripción cualitativa elaborada a partir del seguimiento semestral del equipo técnico. Los detalles clínicos completos están en el Informe de Cierre Anual.</div></div>`:''}
  ${doms? `<div class="card"><h3>Autonomía en la vida diaria</h3><table><tbody>${doms}</tbody></table><div class="hint" style="margin-top:6px">«Apoyo» refiere a la ayuda de otra persona, de una adaptación o de un producto de apoyo para realizar la actividad.</div></div>`:''}
  ${(V.barreras||'').trim()||(V.apoyos||'').trim()? `<div class="card"><h3>Barreras del entorno y apoyos con los que cuenta</h3>
    ${(V.barreras||'').trim()? '<p style="margin-bottom:8px"><b>Barreras identificadas:</b> '+V.barreras+'</p>':''}
    ${(V.apoyos||'').trim()? '<p><b>Apoyos y facilitadores:</b> '+V.apoyos+'</p>':''}</div>`:''}
  <div class="card"><h3>Situación de la valoración oficial y orientación sobre prestaciones</h3>
    <p style="margin-bottom:8px"><b>Estado:</b> ${V.estado}${V.fecha? ' · valorado el '+V.fecha:''}${V.organismo? ' por '+V.organismo:''}${V.vigencia? ' · vigencia hasta '+V.vigencia:''}${V.rnpcd? ' · inscripto en el RNPcD ('+V.rnpcd+')':''}.</p>
    ${cat? '<p style="margin-bottom:8px"><b>Categoría según el baremo:</b> '+cat.cat+' ('+cat.rango+'). '+cat.imp+'</p>':''}
    <p class="hint">La familia puede consultar al equipo de IPPU por la gestión de prestaciones (BPS, MIDES, Sistema de Cuidados, transporte, apoyos educativos). El otorgamiento de cada prestación es resolución del organismo competente.</p>
  </div>
  <div class="card"><div class="grid2">
    <div><label>Por el equipo técnico</label><div style="border-bottom:1px solid var(--ink);height:34px"></div><div class="hint">${p.psicologa||''} · ${p.maestra||''}</div></div>
    <div><label>Recibido por la familia</label><div style="border-bottom:1px solid var(--ink);height:34px"></div></div>
  </div>
  <div class="hint" style="margin-top:12px">Documento descriptivo generado desde la HCE de IPPU · Uso familiar y de orientación · Ley N.º 18.331/2008</div></div>`;
}

/* ============ INICIO ============ */
route();
</script>
