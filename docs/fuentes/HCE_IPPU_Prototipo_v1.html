<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCE IPPU · Prototipo funcional v1 — Sistema de Evaluación TEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2a33; --ink-soft:#4a5d66; --paper:#f4f7f6; --card:#ffffff;
  --brand:#0e5a63; --brand-deep:#083840; --brand-tint:#e3efef;
  --amber:#b35c00; --amber-tint:#fdf1e2;
  --ok:#2e7d4f; --ok-tint:#e8f3ec;
  --danger:#b3403a; --danger-tint:#fbecea;
  --lock:#8a979c; --line:#d9e2e0;
  --radius:10px;
  --font-display:'Bitter', Georgia, serif;
  --font-body:'Archivo', -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html{font-size:15px}
body{font-family:var(--font-body); background:var(--paper); color:var(--ink); line-height:1.5}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; line-height:1.25; color:var(--brand-deep)}
button{font-family:var(--font-body); cursor:pointer}
a{color:var(--brand)}

/* ===== Layout ===== */
.app{display:grid; grid-template-columns:236px 1fr; min-height:100vh}
.sidebar{background:var(--brand-deep); color:#dfeceb; padding:18px 0; position:sticky; top:0; height:100vh; overflow-y:auto}
.logo{padding:0 18px 16px; border-bottom:1px solid rgba(255,255,255,.14); margin-bottom:12px}
.logo h1{color:#fff; font-size:1.15rem}
.logo .sub{font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:#9fc4c2; margin-top:3px}
.navgrp{font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:#7fa6a4; padding:12px 18px 4px}
.nav a{display:block; padding:8px 18px; color:#dfeceb; text-decoration:none; font-size:.92rem; border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.active{background:rgba(255,255,255,.1); border-left-color:#e8b25c; color:#fff; font-weight:600}
.nav .tag{font-size:.62rem; background:rgba(255,255,255,.15); border-radius:4px; padding:1px 6px; margin-left:6px; vertical-align:1px}
.main{padding:26px 34px 60px; max-width:1180px}
.crumb{font-size:.78rem; color:var(--ink-soft); margin-bottom:6px}
.pagehead{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:20px}
.pagehead h2{font-size:1.5rem}
.pagehead p{color:var(--ink-soft); font-size:.9rem; max-width:640px}

/* ===== Cards & tables ===== */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px}
.card h3{font-size:1.05rem; margin-bottom:10px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
table{width:100%; border-collapse:collapse; font-size:.88rem}
th{text-align:left; font-weight:600; color:var(--brand-deep); border-bottom:2px solid var(--brand); padding:7px 8px; font-size:.8rem; text-transform:uppercase; letter-spacing:.03em}
td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top}
tr:hover td{background:#fafcfb}
.num{text-align:center; font-variant-numeric:tabular-nums}

/* ===== KPI ===== */
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px}
.kpi .v{font-family:var(--font-display); font-size:1.7rem; font-weight:700; color:var(--brand)}
.kpi .l{font-size:.76rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em}

/* ===== Badges / estados ===== */
.badge{display:inline-block; font-size:.7rem; font-weight:600; padding:2px 9px; border-radius:20px; letter-spacing:.02em}
.b-firmado{background:var(--ok-tint); color:var(--ok)}
.b-borrador{background:var(--amber-tint); color:var(--amber)}
.b-bloqueado{background:#eef1f1; color:var(--lock)}
.b-alerta{background:var(--danger-tint); color:var(--danger)}

/* ===== Stepper (firma secuencial) — elemento distintivo ===== */
.stepper{display:flex; align-items:stretch; gap:0; margin:14px 0 22px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--card)}
.step{flex:1; padding:12px 14px; border-right:1px solid var(--line); position:relative; cursor:pointer; min-width:0}
.step:last-child{border-right:none}
.step .code{font-size:.66rem; letter-spacing:.08em; color:var(--ink-soft)}
.step .name{font-weight:600; font-size:.86rem; margin:2px 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.step.s-firmado{background:linear-gradient(to bottom,var(--ok-tint),#fff); box-shadow:inset 0 3px 0 var(--ok)}
.step.s-borrador{background:linear-gradient(to bottom,var(--amber-tint),#fff); box-shadow:inset 0 3px 0 var(--amber)}
.step.s-bloqueado{background:#f4f6f6; color:var(--lock); box-shadow:inset 0 3px 0 var(--lock)}
.step.s-bloqueado .name{color:var(--lock)}
.step.active{outline:2px solid var(--brand); outline-offset:-2px; z-index:1}

/* ===== Formularios ===== */
label{display:block; font-size:.78rem; font-weight:600; color:var(--ink-soft); margin-bottom:3px; text-transform:uppercase; letter-spacing:.03em}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:var(--font-body); font-size:.92rem; background:#fff; color:var(--ink)}
textarea{min-height:74px; resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand); outline-offset:0; border-color:var(--brand)}
.frow{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:12px}
fieldset:disabled input, fieldset:disabled select, fieldset:disabled textarea{background:#f2f4f4; color:#69777c}
fieldset{border:none}
.req::after{content:" *"; color:var(--danger)}
.hint{font-size:.76rem; color:var(--ink-soft); margin-top:3px}

/* ===== Likert / puntuación ===== */
.likert{display:flex; gap:4px}
.likert button{width:34px; height:34px; border:1px solid var(--line); background:#fff; border-radius:6px; font-weight:600; font-size:.85rem; color:var(--ink-soft)}
.likert button:hover{border-color:var(--brand)}
.likert button.sel{background:var(--brand); color:#fff; border-color:var(--brand)}
.likert button.sel.v1{background:var(--danger); border-color:var(--danger)}
.likert button.sel.v5{background:var(--ok); border-color:var(--ok)}
.likert button.ns.sel{background:var(--lock); border-color:var(--lock)}
.itemrow{display:grid; grid-template-columns:1fr auto; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); align-items:start}
.itemrow:last-child{border-bottom:none}
.itemrow .txt{font-size:.9rem}
.itemrow .ref{font-size:.72rem; color:var(--ink-soft); margin-top:2px}
.itemrow textarea{min-height:40px; margin-top:6px; font-size:.85rem}
.subtotal{display:flex; justify-content:flex-end; gap:20px; padding:10px 4px 2px; font-size:.9rem}
.subtotal b{font-family:var(--font-display); font-size:1.05rem; color:var(--brand)}

/* ===== Botones ===== */
.btn{display:inline-block; padding:9px 18px; border-radius:8px; border:1px solid var(--brand); background:var(--brand); color:#fff; font-weight:600; font-size:.88rem}
.btn:hover{background:var(--brand-deep)}
.btn.ghost{background:#fff; color:var(--brand)}
.btn.ok{background:var(--ok); border-color:var(--ok)}
.btn.warn{background:#fff; border-color:var(--amber); color:var(--amber)}
.btn:disabled{background:#c8d2d1; border-color:#c8d2d1; cursor:not-allowed}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0}

/* ===== Avisos ===== */
.notice{border-radius:8px; padding:11px 14px; font-size:.86rem; margin:12px 0; border:1px solid}
.n-info{background:var(--brand-tint); border-color:#bcd8d6; color:var(--brand-deep)}
.n-warn{background:var(--amber-tint); border-color:#ecd0a8; color:var(--amber)}
.n-ok{background:var(--ok-tint); border-color:#bfe0cc; color:var(--ok)}
.n-danger{background:var(--danger-tint); border-color:#efc4c1; color:var(--danger)}

/* ===== Tabs de módulos ===== */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.tabs button{padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:#fff; font-size:.84rem; font-weight:600; color:var(--ink-soft)}
.tabs button.active{background:var(--brand); border-color:var(--brand); color:#fff}
.tabs button .lockico{font-size:.75rem}

/* ===== Delta chips ===== */
.delta{font-weight:700; font-variant-numeric:tabular-nums}
.d-pos{color:var(--ok)} .d-neg{color:var(--danger)} .d-zero{color:var(--ink-soft)}

/* ===== Manual ===== */
.manual{display:grid; grid-template-columns:230px 1fr; gap:22px}
.mtoc{position:sticky; top:20px; align-self:start; max-height:88vh; overflow-y:auto}
.mtoc a{display:block; font-size:.82rem; padding:5px 10px; color:var(--ink-soft); text-decoration:none; border-left:2px solid var(--line)}
.mtoc a:hover{color:var(--brand); border-left-color:var(--brand)}
.mtoc .g{font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--brand); padding:12px 10px 4px; font-weight:700}
.mbody h3{margin-top:22px; padding-top:14px; border-top:1px solid var(--line)}
.mbody p, .mbody li{font-size:.9rem; margin-bottom:8px; color:#2b3b43}
.mbody ul, .mbody ol{padding-left:20px; margin-bottom:10px}
.mbody table{margin:10px 0 16px}

/* ===== Radar SVG ===== */
.radarwrap{display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start}
.legend{font-size:.8rem}
.legend span{display:inline-flex; align-items:center; gap:6px; margin-right:16px}
.legend i{width:14px; height:4px; border-radius:2px; display:inline-block}

/* ===== Criterios desplegables (IDEA) ===== */
details.crit{margin-top:6px}
details.crit summary{cursor:pointer; font-size:.78rem; font-weight:600; color:var(--brand); list-style:none; display:inline-block; padding:3px 10px; border:1px solid var(--brand); border-radius:14px}
details.crit summary::before{content:'? '; font-weight:700}
details.crit[open] summary{background:var(--brand); color:#fff}
details.crit .critbody{margin-top:8px; background:#f6f9f8; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:.82rem}
details.crit .critbody .que{margin-bottom:8px; color:var(--brand-deep)}
details.crit table td{padding:4px 8px; font-size:.8rem}
details.crit td.lv{font-weight:700; width:26px; text-align:center; color:var(--brand)}

/* ===== Documentos y fotos ===== */
.thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; margin-top:12px}
.thumb{border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff}
.thumb img{width:100%; height:110px; object-fit:cover; display:block}
.thumb .cap{font-size:.72rem; padding:6px 8px; color:var(--ink-soft)}
.uprow{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:10px}
.uprow > div{flex:1; min-width:160px}

/* ===== Impresión de informe ===== */
@media print{
  .sidebar,.toolbar,.tabs,.stepper,.no-print{display:none!important}
  .app{grid-template-columns:1fr}
  .main{padding:0; max-width:none}
  .card{border:none; padding:6px 0; break-inside:avoid}
  body{background:#fff}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static; height:auto}
  .grid2,.grid3,.grid4,.manual{grid-template-columns:1fr}
  .main{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <h1>HCE · IPPU</h1>
      <div class="sub">Fundación IPPU · Prototipo v1</div>
      <div class="sub" style="margin-top:6px; color:#e8b25c">Para revisión UTEC-LIDIA</div>
    </div>
    <nav class="nav" id="nav">
      <div class="navgrp">General</div>
      <a href="#/inicio" data-route="inicio">Panel institucional</a>
      <div class="navgrp">Servicio de Atención Diurna</div>
      <a href="#/pacientes" data-route="pacientes">Usuarios y HCE</a>
      <a href="#/grupos" data-route="grupos">Grupos de referencia</a>
      <a href="#/reportes" data-route="reportes">Reportes</a>
      <div class="navgrp">Otros servicios</div>
      <a href="#/taller" data-route="taller">Taller Terapéutico <span class="tag">fase 2</span></a>
      <a href="#/clinica" data-route="clinica">Clínica <span class="tag">fase 2</span></a>
      <div class="navgrp">Documentación</div>
      <a href="#/manual" data-route="manual">Manual de Procedimientos</a>
      <a href="#/specs" data-route="specs">Especificaciones técnicas</a>
    </nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
/* ================================================================
   HCE IPPU — Prototipo funcional v1 (2026)
   Sistema Integrado de Evaluación y Seguimiento TEA
   Instrumentos: IDEA (Rivière, 2001) · Escala IPPU-TEA Prot. A/B ·
   Informe de Cierre Anual. Manual de Procedimientos v1.0 integrado.
   NOTA: prototipo sin persistencia (datos en memoria). El backend
   real de UTEC deberá implementar base de datos, autenticación,
   firma digital y registro de auditoría (HCE-LOG).
   ================================================================ */

/* ============ DEFINICIONES DE INSTRUMENTOS ============ */

const ESCALAS = ['Relación Social','Comunicación y Lenguaje','Anticipación y Flexibilidad','Simbolización'];

// IDEA (Rivière, 2001) — 12 dimensiones, escala 0/2/4/6/8 (impares intermedios), NS = sin observación suficiente
const IDEA_DIMS = [
 {d:1, e:0, n:'Trastorno de la relación social', ref:'Escala 1 · Relación Social'},
 {d:2, e:0, n:'Trastorno de la referencia conjunta', ref:'Escala 1 · Relación Social'},
 {d:3, e:0, n:'Trastorno intersubjetivo y mentalista', ref:'Escala 1 · Relación Social'},
 {d:4, e:1, n:'Trastorno de las funciones comunicativas', ref:'Escala 2 · Comunicación y Lenguaje'},
 {d:5, e:1, n:'Trastorno del lenguaje expresivo', ref:'Escala 2 · Comunicación y Lenguaje'},
 {d:6, e:1, n:'Trastorno del lenguaje receptivo', ref:'Escala 2 · Comunicación y Lenguaje'},
 {d:7, e:2, n:'Trastorno de la anticipación', ref:'Escala 3 · Anticipación y Flexibilidad'},
 {d:8, e:2, n:'Trastorno de la flexibilidad', ref:'Escala 3 · Anticipación y Flexibilidad'},
 {d:9, e:2, n:'Trastorno del sentido de la actividad', ref:'Escala 3 · Anticipación y Flexibilidad'},
 {d:10,e:3, n:'Trastorno de la ficción y la imaginación', ref:'Escala 4 · Simbolización'},
 {d:11,e:3, n:'Trastorno de la imitación', ref:'Escala 4 · Simbolización'},
 {d:12,e:3, n:'Trastorno de la suspensión (creación de significantes)', ref:'Escala 4 · Simbolización'}
];

// Criterios de anclaje por dimensión — síntesis operativa adaptada de los descriptores
// del IDEA (Rivière, 2001) para consulta rápida durante la puntuación. El texto íntegro
// del instrumento original debe estar disponible para el equipo en HCE-DOC institucional.
const IDEA_DESC = [
 {que:'Cualidad del vínculo y del interés por las personas: desde el aislamiento completo hasta la motivación de relación con iguales.',
  n8:'Aislamiento completo; impermeabilidad a las personas y a sus iniciativas.',
  n6:'Incapacidad de relación con iguales, aunque hay vínculo establecido con algunos adultos.',
  n4:'Relaciones con iguales infrecuentes, inducidas desde fuera y de carácter externo.',
  n2:'Hay motivación por relacionarse con iguales, pero dificultad para establecer relaciones por falta de comprensión de las sutilezas sociales.',
  n0:'Sin trastorno cualitativo de la relación social.'},
 {que:'Capacidad de compartir la acción, la atención y la preocupación con otra persona (mirada referencial, acción conjunta).',
  n8:'Ausencia completa de acciones conjuntas o de interés por las acciones de otras personas.',
  n6:'Realiza acciones conjuntas simples, sin miradas significativas de referencia conjunta.',
  n4:'Emplea miradas de referencia conjunta en situaciones dirigidas, pero no en situaciones abiertas.',
  n2:'Pautas de atención y acción conjunta establecidas; pueden faltar la preocupación conjunta o los marcos comunes de referencia.',
  n0:'Sin trastorno cualitativo de la referencia conjunta.'},
 {que:'Sintonía emocional con las personas y comprensión de que los otros tienen mente (intersubjetividad, teoría de la mente).',
  n8:'Ausencia de pautas de expresión emocional correlativa (intersubjetividad primaria); falta de interés por las personas.',
  n6:'Respuestas intersubjetivas primarias ocasionales; sin indicios de intersubjetividad secundaria.',
  n4:'Indicios de intersubjetividad secundaria, sin atribución explícita de mente; no resuelve tareas mentalistas.',
  n2:'Conciencia explícita de que las otras personas tienen mente; resuelve tareas mentalistas simples pero con dificultades en situaciones naturales.',
  n0:'Sin trastorno cualitativo intersubjetivo o mentalista.'},
 {que:'Para qué se comunica: desde la ausencia de comunicación intencional hasta la capacidad de declarar y compartir experiencia.',
  n8:'Ausencia de comunicación entendida como relación intencionada mediante significantes.',
  n6:'Conductas instrumentales con personas para pedir (p. ej., llevar de la mano), sin otras pautas comunicativas.',
  n4:'Conductas comunicativas para pedir (cambiar el mundo físico), pero no para compartir experiencia o cambiar el mundo mental.',
  n2:'Comunica para declarar y comentar, con escasez de declaraciones sobre el mundo interno propio.',
  n0:'Sin trastorno cualitativo de las funciones comunicativas.'},
 {que:'Producción del lenguaje: desde el mutismo hasta el discurso conversacional.',
  n8:'Mutismo total o funcional (pueden existir verbalizaciones sin valor comunicativo).',
  n6:'Palabras sueltas o ecolalias; no hay oraciones creativas.',
  n4:'Oraciones con algún grado de creación propia, que no llegan a configurar discurso ni conversación.',
  n2:'Lenguaje discursivo con dificultades: conversación limitada, poco recíproca o poco flexible.',
  n0:'Sin trastorno cualitativo del lenguaje expresivo.'},
 {que:'Comprensión del lenguaje: desde la desatención total al habla hasta la comprensión del discurso con dificultades sutiles.',
  n8:'"Sordera central": ignora por completo el lenguaje; no responde a órdenes ni a su nombre.',
  n6:'Asocia enunciados verbales con conductas propias (comprende órdenes simples), sin comprender el lenguaje como sistema.',
  n4:'Comprensión literal, poco flexible y descontextualizada de enunciados; no comprende discurso.',
  n2:'Comprende discurso y participa en conversaciones, con dificultades para ironía, sarcasmo y doble sentido.',
  n0:'Sin trastorno cualitativo del lenguaje receptivo.'},
 {que:'Capacidad de anticipar lo que va a suceder y de manejar los cambios del entorno.',
  n8:'Adherencia inflexible a estímulos que se repiten de forma idéntica; resistencia intensa a cambios; sin conductas anticipatorias.',
  n6:'Conductas anticipatorias simples en rutinas cotidianas; oposición frecuente a los cambios.',
  n4:'Incorpora estructuras temporales amplias; puede haber reacciones catastróficas ante cambios no anticipados.',
  n2:'Alguna capacidad de regular el propio ambiente y de manejar cambios; prefiere un orden claro, con cierta flexibilidad.',
  n0:'Sin trastorno cualitativo de la anticipación.'},
 {que:'Rigidez conductual y mental: estereotipias, rituales, apegos y contenidos obsesivos.',
  n8:'Predominio de estereotipias motoras simples.',
  n6:'Rituales simples; resistencia a cambios mínimos del entorno.',
  n4:'Rituales complejos; apego excesivo a objetos; preguntas obsesivas.',
  n2:'Contenidos de pensamiento obsesivos y limitados; intereses poco funcionales y poco flexibles.',
  n0:'Sin trastorno cualitativo de la flexibilidad.'},
 {que:'Grado en que la actividad propia tiene propósito y sentido para la persona.',
  n8:'Predominio masivo de conductas sin propósito ni meta.',
  n6:'Actividades funcionales breves ante consignas externas; sin comprensión de la finalidad.',
  n4:'Actividades autónomas de ciclo largo que se realizan sin comprensión precisa de su sentido.',
  n2:'Presencia de motivos de logro; actividades complejas cuyo sentido se comprende de forma parcial; requiere motivación externa.',
  n0:'Sin trastorno cualitativo del sentido de la actividad.'},
 {que:'Juego funcional, juego simbólico y capacidad de crear ficciones.',
  n8:'Ausencia completa de juego funcional y simbólico.',
  n6:'Juegos funcionales elementales, poco flexibles, inducidos desde fuera y repetitivos.',
  n4:'Juego simbólico evocado y poco espontáneo; ficciones escasas y poco flexibles.',
  n2:'Ficciones complejas, utilizadas a veces como recurso de aislamiento o con dificultades para diferenciar ficción y realidad.',
  n0:'Sin trastorno cualitativo de la ficción y la imaginación.'},
 {que:'Capacidad de imitar acciones, gestos y modelos de otras personas.',
  n8:'Ausencia completa de conductas de imitación.',
  n6:'Imitaciones motoras simples, evocadas desde fuera; no espontáneas.',
  n4:'Imitación espontánea esporádica, poco versátil y poco intersubjetiva.',
  n2:'Imitación establecida; ausencia de modelos internos de referencia; imitación poco flexible.',
  n0:'Sin trastorno cualitativo de la imitación.'},
 {que:'Capacidad de "dejar en suspenso" acciones y significados para crear significantes: señalar, simbolizar, comprender metáforas.',
  n8:'No suspende preacciones para crear gestos comunicativos (p. ej., no señala).',
  n6:'No suspende acciones instrumentales para crear símbolos enactivos (no hay juego funcional).',
  n4:'No suspende las propiedades reales de los objetos para crear ficciones y juego simbólico.',
  n2:'No deja en suspenso representaciones para comprender metáforas, ironía o doble sentido.',
  n0:'Sin trastorno cualitativo de la suspensión.'}
];

// Escala IPPU-TEA — 24 ítems (Protocolos A y B comparten ítems)
const IPPU_ITEMS = [

/* ============ HELPERS DE CÁLCULO ============ */

function ideaTotales(p){ // p = array de 12 (número 0–8 o 'NS' o null)
  const esc=[0,0,0,0]; let comp=true;
  IDEA_DIMS.forEach((dm,ix)=>{const v=p[ix]; if(typeof v==='number') esc[dm.e]+=v; else comp=false;});
  return {esc, total:esc.reduce((a,b)=>a+b,0), completo:comp};
}
function ideaInterpreta(t){
  // Lecturas orientativas neutras: aluden a las escalas del IDEA sin prescribir
  // técnicas ni métodos. La elección del abordaje corresponde al equipo técnico.
  if(t<=15) return {perfil:'Muy leve', ns:'Nivel 1', txt:'Sugerencia: priorizar los objetivos en las dimensiones del IDEA con mayor puntaje individual.'};
  if(t<=30) return {perfil:'Leve', ns:'Nivel 1', txt:'Sugerencia: revisar el perfil por escala del IDEA para focalizar los apoyos donde la afectación relativa es mayor.'};
  if(t<=55) return {perfil:'Leve a moderado', ns:'Nivel 1–2', txt:'Sugerencia: atender especialmente las Escalas 1 y 2 del IDEA (Relación Social y Comunicación) al definir objetivos del semestre.'};
  if(t<=75) return {perfil:'Moderado', ns:'Nivel 2', txt:'Sugerencia: el perfil por escala del IDEA orienta la priorización de apoyos; valorar en equipo la necesidad de apoyos a la comunicación (Escala 2).'};
  if(t<=90) return {perfil:'Moderado a severo (alta necesidad de apoyo)', ns:'Nivel 2–3', txt:'Sugerencia: perfil de alta necesidad de apoyo; leer las cuatro escalas del IDEA en conjunto para estructurar los apoyos del entorno grupal.'};
  return {perfil:'Severo a muy severo (necesidad de apoyo muy sustancial)', ns:'Nivel 3', txt:'Sugerencia: apoyo muy sustancial en todas las áreas; los objetivos se anclan en las dimensiones del IDEA de mayor puntaje.'};
}
function protTotales(p){ // array de 24 (1–5 o null)
  const esc=[0,0,0,0]; let comp=true;
  IPPU_ITEMS.forEach((it,ix)=>{const v=p[ix]; if(typeof v==='number') esc[it.e]+=v; else comp=false;});
  return {esc, total:esc.reduce((a,b)=>a+b,0), completo:comp};
}
function deltaInterpreta(d){
  if(d>=13) return {t:'Progreso muy significativo', a:'Documentar y analizar qué estrategias lo produjeron para replicarlas.', c:'d-pos'};
  if(d>=7)  return {t:'Progreso significativo', a:'Documentar; mantener la línea de intervención.', c:'d-pos'};
  if(d>=1)  return {t:'Progreso leve', a:'Revisar si los objetivos de esa escala son suficientemente ambiciosos.', c:'d-pos'};
  if(d===0) return {t:'Sin cambio', a:'Analizar si el área está consolidada o requiere mayor intensidad.', c:'d-zero'};
  if(d>=-6) return {t:'Regresión leve', a:'Identificar factores contextuales; revisar estrategias.', c:'d-neg'};
  return {t:'Regresión significativa', a:'Reunión técnica urgente; contacto con familia; posible revisión del plan.', c:'d-neg'};
}
function fmtDelta(d){const s=d>0?'+':''; return s+d;}
function esign(v){return v>0?'d-pos':(v<0?'d-neg':'d-zero');}

  ];
}

/* ============ RADAR SVG (sin librerías) ============ */
// series: [{label,color,vals:[4], max}] — cada serie normalizada a su propio máximo
function radarSVG(series, size){
  size = size||300; const cx=size/2, cy=size/2, R=size/2-46;
  const axes = ESCALAS.length;
  function pt(i, frac){const a=-Math.PI/2 + i*2*Math.PI/axes; return [cx+R*frac*Math.cos(a), cy+R*frac*Math.sin(a)];}
  let s = '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" role="img" style="max-width:100%">';
  for(let g=1; g<=4; g++){
    const pts = Array.from({length:axes},(_,i)=>pt(i,g/4).join(',')).join(' ');
    s += '<polygon points="'+pts+'" fill="none" stroke="#d9e2e0" stroke-width="1"/>';
  }
  for(let i=0;i<axes;i++){
    const [x,y]=pt(i,1); s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#d9e2e0"/>';
    const [lx,ly]=pt(i,1.22);
    const short=['Relación\nSocial','Comunicación\ny Lenguaje','Anticipación\ny Flexibilidad','Simbolización'][i].split('\n');
    s+='<text x="'+lx+'" y="'+(ly-5)+'" font-size="10.5" font-weight="600" fill="#1b2a33" text-anchor="middle">'+short[0]+'</text>';
    if(short[1]) s+='<text x="'+lx+'" y="'+(ly+7)+'" font-size="10.5" font-weight="600" fill="#1b2a33" text-anchor="middle">'+short[1]+'</text>';
  }
  series.forEach(se=>{
    const pts = se.vals.map((v,i)=>pt(i, Math.max(0.02, v/se.max)).join(',')).join(' ');
    s += '<polygon points="'+pts+'" fill="'+se.color+'22" stroke="'+se.color+'" stroke-width="2"/>';
    se.vals.forEach((v,i)=>{const [x,y]=pt(i, Math.max(0.02, v/se.max)); s+='<circle cx="'+x+'" cy="'+y+'" r="3" fill="'+se.color+'"/>';});
  });
  return s+'</svg>';
}

/* ============ ROUTER ============ */
function route(){
  const h = location.hash || '#/inicio';
  const seg = h.replace('#/','').split('/');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.route===seg[0]));
  const M = document.getElementById('main');
  if(seg[0]==='inicio') M.innerHTML = vInicio();
  else if(seg[0]==='pacientes' && seg[1]) { UI.paciente=seg[1]; M.innerHTML = vFicha(seg[1]); }
  else if(seg[0]==='pacientes') M.innerHTML = vPacientes();
  else if(seg[0]==='grupos') M.innerHTML = vGrupos(seg[1]?decodeURIComponent(seg[1]):'');
  else if(seg[0]==='reportes' && seg[1]==='vf' && seg[2]){ const p=getP(seg[2]); M.innerHTML = p? vReporteVF(p) : '<p>Usuario no encontrado.</p>'; }
  else if(seg[0]==='reportes') M.innerHTML = vReportes(seg[1]||'');
  else if(seg[0]==='taller') M.innerHTML = vPlaceholder('Taller Terapéutico');
  else if(seg[0]==='clinica') M.innerHTML = vPlaceholder('Clínica');
  else if(seg[0]==='manual') M.innerHTML = vManual();
  else if(seg[0]==='specs') M.innerHTML = vSpecs();
  else M.innerHTML = vInicio();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
function getP(id){ return DB.pacientes.find(x=>x.id===id); }
function badge(st){
  const m={firmado:['b-firmado','Firmado'],borrador:['b-borrador','Borrador'],bloqueado:['b-bloqueado','Bloqueado']};

function vFicha(id){
  const p = getP(id); if(!p) return '<p>Usuario no encontrado.</p>';
  const steps = pipeline(p).map(s=>{
    return `<div class="step s-${s.st} ${UI.modulo===s.key?'active':''}" onclick="setMod('${s.key}')">
      <div class="code">${s.code}</div><div class="name">${s.name}</div>${badge(s.st)}</div>`;
  }).join('');
  const tabs = [['resumen','Resumen'],['anamnesis','HCE-00 Anamnesis'],['ci','HCE-CI Consentimiento'],['idea','HCE-LB · IDEA'],['protA','HCE-PA · Protocolo A'],['protB','HCE-PB · Protocolo B'],['cierre','HCE-IC · Cierre anual'],['docs','HCE-DOC · Documentos y fotos'],['org','HCE-ORG · INAU / BPS'],['vf','HCE-VF · Valoración funcional'],['log','HCE-LOG']]
    .map(([k,t])=>`<button class="${UI.modulo===k?'active':''}" onclick="setMod('${k}')">${t}</button>`).join('');
  return `
  <div class="crumb"><a href="#/pacientes">Usuarios</a> / ${p.hc}</div>

  <p>${p.grupo} · Año lectivo ${p.anio} · ${p.diag||'Sin diagnóstico registrado'} · CIE-11: ${p.cie11} · Soporte orientativo: ${p.nivel}<br>

  <div class="stepper">${steps}</div>
  <div class="tabs">${tabs}</div>
  <div id="modbody">${renderModulo(p)}</div>`;
}
function setMod(k){ UI.modulo=k; const p=getP(UI.paciente); if(!p) return;
  document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active', ['resumen','anamnesis','ci','idea','protA','protB','cierre','docs','org','vf','log'][i]===k));
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('modbody').innerHTML = renderModulo(p);
}
function renderModulo(p){
  switch(UI.modulo){
    case 'anamnesis': return mAnamnesis(p);
    case 'ci': return mCI(p);
    case 'idea': return mIDEA(p);
    case 'protA': return mProt(p,'protA');
    case 'protB': return mProt(p,'protB');
    case 'cierre': return mCierre(p);
    case 'docs': return mDocs(p);
    case 'org': return mOrg(p);
    case 'vf': return mVF(p);
    case 'log': return mLog(p);
    default: return mResumen(p);
  }
}

    ${textoCI(p)}</div>`;
  return `<div class="card"><h3>HCE-CI · Consentimiento informado</h3>
    <div class="notice n-danger">Sin consentimiento firmado, <b>ningún módulo de evaluación puede habilitarse</b> (Ley N.º 18.331/2008; Manual, §19.1 y Anexo C).</div>
    ${textoCI(p)}
    <div class="frow">
      <div><label class="req">Nombre del padre/madre/tutor</label><input type="text" id="ci_nom"></div>
      <div><label class="req">Fecha</label><input type="date" id="ci_fec" value="2026-07-12"></div>
    </div>
    <button class="btn ok" onclick="firmarCI('${p.id}')">Registrar firma del consentimiento</button>
    <div class="hint" style="margin-top:8px">En el sistema definitivo, este paso debe capturar firma manuscrita digitalizada o firma electrónica y adjuntar el documento escaneado en HCE-DOC.</div></div>`;
}
function textoCI(p){
  return `<div class="notice n-info" style="line-height:1.6">La familia autoriza a la Fundación IPPU a: (1) aplicar el IDEA (Rivière, 2001) al ingreso; (2) aplicar la Escala IPPU-TEA al cierre de cada semestre; (3) elaborar el Informe de Cierre Anual; (4) registrar los datos en la HCE bajo la Ley N.º 18.331/2008; (5) compartir el Informe de Cierre con INAU, BPS y MSP cuando sea requerido en auditorías. La familia conserva el derecho de acceso a la HCE (Ley N.º 18.335/2008) y puede revocar el consentimiento en cualquier momento.</div>`;
}
function firmarCI(id){
  const nom=document.getElementById('ci_nom').value, fec=document.getElementById('ci_fec').value;
  if(!nom||!fec){alert('Complete nombre y fecha del firmante.');return;}
  const p=getP(id); p.ci_firmado=true; p.ci_firmante=nom; p.ci_fecha=fec;
  if(p.idea.estado==='bloqueado') p.idea.estado='borrador';
  route(); UI.modulo='ci'; setMod('ci');
}

/* ---- HCE-LB IDEA ---- */
function mIDEA(p){
  if(!p.ci_firmado) return bloqueadoMsg('El IDEA requiere el consentimiento informado firmado (HCE-CI). Este requisito es legal (Ley N.º 18.331/2008) y no admite excepción.');
  const ed = p.idea.estado==='borrador';
  const t = ideaTotales(p.idea.punt);
  const opciones=[0,1,2,3,4,5,6,7,8];
  let porEscala='';
  for(let e=0;e<4;e++){
    const dims = IDEA_DIMS.filter(d=>d.e===e);
    porEscala += `<div class="card"><h3>Escala ${e+1} · ${ESCALAS[e]}</h3>` + dims.map(dm=>{
      const ix=dm.d-1, v=p.idea.punt[ix];
      const btns = opciones.map(o=>`<button ${ed?'':'disabled'} class="${v===o?'sel':''} ${o%2?'':''}" title="${o%2?'Valor intermedio':''}" onclick="setIdea('${p.id}',${ix},${o})">${o}</button>`).join('')
        + `<button ${ed?'':'disabled'} class="ns ${v==='NS'?'sel':''}" title="No suficiente observación" onclick="setIdea('${p.id}',${ix},'NS')">NS</button>`;
      const dsc = IDEA_DESC[ix];
      return `<div class="itemrow"><div><div class="txt"><b>D${dm.d}.</b> ${dm.n}</div><div class="ref">Puntuación 0–8 (impares = intermedios) · regla: ante la duda, el valor menor · conducta habitual, sin apoyo, en contexto grupal</div>
        <details class="crit"><summary>Qué evalúa · criterios 0–8</summary><div class="critbody">
          <div class="que"><b>Qué evalúa:</b> ${dsc.que}</div>
          <table><tbody>
            <tr><td class="lv">8</td><td>${dsc.n8}</td></tr>
            <tr><td class="lv">6</td><td>${dsc.n6}</td></tr>
            <tr><td class="lv">4</td><td>${dsc.n4}</td></tr>
            <tr><td class="lv">2</td><td>${dsc.n2}</td></tr>
            <tr><td class="lv">0</td><td>${dsc.n0}</td></tr>
          </tbody></table>
          <div class="hint" style="margin-top:6px">Impares (1, 3, 5, 7): la conducta está claramente entre dos niveles pares. NS: observación insuficiente. Síntesis adaptada del IDEA (Rivière, 2001); el texto completo del instrumento debe consultarse en HCE-DOC institucional.</div>
        </div></details>
        <textarea ${ed?'':'disabled'} placeholder="Observación / fundamentación (obligatoria si hubo diferencia entre evaluadores)" onchange="getP('${p.id}').idea.obs[${ix}]=this.value">${p.idea.obs[ix]||''}</textarea></div>
        <div class="likert">${btns}</div></div>`;
    }).join('') + `<div class="subtotal">Total Escala ${e+1}: <b>${t.esc[e]} / 24</b></div></div>`;
  }
  const int = ideaInterpreta(t.total);
  return `
  ${ed? '<div class="notice n-warn"><b>Módulo en borrador.</b> Puntuación por consenso de los técnicos responsables tras evaluación independiente de cada uno (Manual, §6). Mínimo 5 sesiones de observación previas.</div>'
      : '<div class="notice n-ok"><b>Módulo firmado y bloqueado</b> ('+p.idea.fecha+'). Correcciones posteriores solo por addenda (Manual, §6, paso 6).</div>'}
  <div class="card"><div class="frow">
    <div><label class="req">Fecha de consenso</label><input type="date" ${ed?'':'disabled'} value="${p.idea.fecha}" onchange="getP('${p.id}').idea.fecha=this.value"></div>
    <div><label>Sesiones de observación previas (recomendado: 5)</label><input type="number" min="0" ${ed?'':'disabled'} value="${p.idea.sesiones}" onchange="getP('${p.id}').idea.sesiones=this.value"></div>
  </div>
  <label style="display:flex;gap:8px;align-items:center;text-transform:none;font-weight:400;font-size:.86rem;cursor:pointer">
    <input type="checkbox" style="width:auto" ${p.idea.migrado?'checked':''} ${ed?'':'disabled'} onchange="getP('${p.id}').idea.migrado=this.checked">
    <span>Este IDEA proviene de la <b>HCE anterior de IPPU</b> (migración estructurada, verificada contra el registro original). El documento fuente debe adjuntarse en HCE-DOC.</span></label>
  </div>
  ${porEscala}
  <div class="card"><h3>Resultado</h3>
    <div class="grid4">
      ${t.esc.map((v,i)=>`<div class="kpi"><div class="v">${v}<span style="font-size:.9rem;color:var(--ink-soft)"> / 24</span></div><div class="l">Escala ${i+1}</div></div>`).join('')}
    </div>
    <div class="notice ${t.completo?'n-info':'n-warn'}" style="margin-top:12px">
    ${t.completo? `<b>Total IDEA: ${t.total} / 96</b> — Perfil orientativo: <b>${int.perfil}</b> · Soporte DSM-5-TR orientativo: <b>${int.ns}</b>. ${int.txt} <span class="hint">Orientativo, no diagnóstico. El nivel definitivo lo asigna el equipo médico.</span>`
      : 'Hay dimensiones sin puntuar o marcadas <b>NS</b> (observación insuficiente). El módulo no puede firmarse hasta completar las 12 dimensiones (Manual, §6, paso 2).'}</div>
    <div class="frow" style="margin-top:10px">
      <div style="grid-column:1/-1"><label class="req">Síntesis clínica narrativa (mín. 200 palabras)</label><textarea ${ed?'':'disabled'} style="min-height:110px" onchange="getP('${p.id}').idea.sintesis=this.value">${p.idea.sintesis||''}</textarea></div>
      <div style="grid-column:1/-1"><label class="req">Objetivos de intervención — 1.er semestre (mín. 3)</label><textarea ${ed?'':'disabled'} onchange="getP('${p.id}').idea.objetivos=this.value">${p.idea.objetivos||''}</textarea></div>
    </div>
    ${ed? `<div class="toolbar"><button class="btn ok" onclick="firmarIDEA('${p.id}')">Firmar módulo (técnicos responsables)</button>
    <span class="hint">La firma bloquea la edición y habilita el Protocolo A.</span></div>`:''}
  </div>`;
}
function setIdea(id,ix,v){ const p=getP(id); p.idea.punt[ix] = (p.idea.punt[ix]===v? null : v); setMod('idea'); }
function firmarIDEA(id){
  const p=getP(id); const t=ideaTotales(p.idea.punt);
  // Requisitos de integridad (duros): sin ellos el registro no tiene sentido clínico
  const err=[];
  if(!p.idea.fecha) err.push('fecha de consenso');
  if(!t.completo) err.push('las 12 dimensiones puntuadas (sin NS ni vacíos)');
  if(!(p.idea.sintesis||'').trim()) err.push('síntesis clínica');
  if(!(p.idea.objetivos||'').trim()) err.push('objetivos del período');
  if(err.length){alert('Para firmar se requiere completar:\n• '+err.join('\n• '));return;}
  // Recomendaciones (flexibles): se puede firmar dejando constancia del motivo
  const avisos=[];
  if(!p.idea.sesiones || +p.idea.sesiones<5) avisos.push('menos de 5 sesiones de observación previas (recomendado por el Manual)');
  if(!excepcionFlexible(p,'HCE-LB',avisos)) return;
  p.idea.estado='firmado';
  if(p.protA.estado==='bloqueado') p.protA.estado='borrador';
  setMod('idea'); route();
}
// Manejo de recomendaciones flexibles: nunca bloquean; piden dejar constancia
function excepcionFlexible(p,mod,avisos){
  if(!avisos.length) return true;
  const just = prompt('Este módulo se aparta de recomendaciones del Manual:\n• '+avisos.join('\n• ')+'\n\nPuede firmarse igualmente. Escriba una breve constancia del motivo (quedará registrada en HCE-LOG):');
  if(just===null) return false; // el equipo decide volver atrás
  (p.excepciones=p.excepciones||[]).push({fecha:new Date().toISOString().slice(0,10), mod, motivo:(just||'Sin detalle')+' — Recomendaciones: '+avisos.join('; ')});
  return true;
}
// Habilitación excepcional de un módulo bloqueado por secuencia
function habilitarExcepcional(id,key,nombre){
  const p=getP(id);
  const just=prompt('El flujo sugerido indica completar y firmar el módulo anterior antes de abrir '+nombre+'.\n\nPuede habilitarse igualmente si la situación del NNA lo requiere. Escriba una breve constancia del motivo (quedará registrada en HCE-LOG):');
  if(just===null) return;
  (p.excepciones=p.excepciones||[]).push({fecha:new Date().toISOString().slice(0,10), mod:nombre, motivo:'Habilitación fuera de secuencia: '+(just||'Sin detalle')});
  if(key==='idea') p.idea.estado='borrador'; else p[key].estado='borrador';
  setMod(key); route();
}
function bloqueadoMsg(txt){return '<div class="notice n-warn"><b>Módulo no habilitado aún.</b> '+txt+'</div>';}
function habilitarBtn(id,key,nombre){return '<div class="toolbar"><button class="btn warn" onclick="habilitarExcepcional(\''+id+'\',\''+key+'\',\''+nombre+'\')">Habilitar excepcionalmente (con constancia en HCE-LOG)</button></div><div class="hint">El sistema orienta el orden de aplicación pero no lo impone: circunstancias como ingresos tardíos, reingresos, licencias del equipo o situaciones familiares pueden requerir apartarse de la secuencia. La constancia protege la trazabilidad clínica.</div>';}

/* ---- HCE-PA / HCE-PB (Escala IPPU-TEA) ---- */
function mProt(p,key){
  const esB = key==='protB';
  const M = p[key];
  if(M.estado==='bloqueado') return bloqueadoMsg((esB? 'El flujo sugerido indica firmar el Protocolo A antes de abrir el Protocolo B (Manual, §12).' : 'El flujo sugerido indica firmar la línea base IDEA antes de abrir el Protocolo A (Manual, §11).'))
    + habilitarBtn(p.id, key, esB?'el Protocolo B':'el Protocolo A');
  const ed = M.estado==='borrador';
  const t = protTotales(M.punt);
  let porEscala='';
  for(let e=0;e<4;e++){
    const its = IPPU_ITEMS.map((it,ix)=>({it,ix})).filter(x=>x.it.e===e);
    porEscala += `<div class="card"><h3>Escala E${e+1} · ${ESCALAS[e]}</h3>`+ its.map(({it,ix})=>{
      const v=M.punt[ix];
      const btns=[1,2,3,4,5].map(o=>`<button ${ed?'':'disabled'} class="${v===o?('sel v'+o):''}" title="${LIKERT_LBL[o]}" onclick="setProt('${p.id}','${key}',${ix},${o})">${o}</button>`).join('');
      const obsReq = (v===1||v===5);
      return `<div class="itemrow"><div><div class="txt"><b>${e+1}.${it.i}</b> ${it.t}</div><div class="ref">${it.r}</div>
        <textarea ${ed?'':'disabled'} placeholder="Observación del equipo técnico${obsReq?' — OBLIGATORIA para valores 1 y 5':''}" onchange="getP('${p.id}').${key}.obs[${ix}]=this.value">${M.obs[ix]||''}</textarea>
        ${obsReq && !(M.obs[ix]||'').trim() ? '<div class="hint" style="color:var(--danger)">Valor '+v+' ('+LIKERT_LBL[v]+'): requiere observación obligatoria (Manual, §13).</div>':''}</div>
        <div class="likert">${btns}</div></div>`;
    }).join('') + `<div class="subtotal">Total E${e+1}: <b>${t.esc[e]} / 30</b>${esB && p.protA.estado==='firmado'? deltaChip(t.esc[e]-protTotales(p.protA.punt).esc[e]):''}</div></div>`;
  }
  let deltaCard='';
  if(esB && p.protA.estado==='firmado' && t.completo){
    const a=protTotales(p.protA.punt); const dT=t.total-a.total;
    deltaCard = `<div class="card"><h3>Delta anual (Δ = Protocolo B − Protocolo A)</h3>
    <table><thead><tr><th>Escala</th><th class="num">Prot. A</th><th class="num">Prot. B</th><th class="num">Δ</th><th>Interpretación</th><th>Acción recomendada</th></tr></thead><tbody>
    ${ESCALAS.map((e,i)=>{const d=t.esc[i]-a.esc[i]; const di=deltaInterpreta(d);
      return `<tr><td>${e}</td><td class="num">${a.esc[i]}</td><td class="num">${t.esc[i]}</td><td class="num"><span class="delta ${di.c}">${fmtDelta(d)}</span></td><td>${di.t}</td><td class="hint">${di.a}</td></tr>`;}).join('')}
    <tr><td><b>Total</b></td><td class="num"><b>${a.total}</b></td><td class="num"><b>${t.total}</b></td><td class="num"><span class="delta ${esign(dT)}"><b>${fmtDelta(dT)}</b></span></td><td colspan="2">${deltaInterpreta(dT).t} (evolución global del año)</td></tr>
    </tbody></table>
    <div class="hint" style="margin-top:8px">El Δ solo es válido entre Protocolos A y B. Nunca calcular delta contra el IDEA: son escalas distintas, 0–96 vs. 24–120 (Manual, §12, paso 4).</div></div>`;
  }
  const semLbl = esB? 'Segundo semestre — última semana del año lectivo' : 'Primer semestre — semanas 1–2 del receso de julio';
  return `
  ${ed? `<div class="notice n-warn"><b>Módulo en borrador.</b> ${semLbl}. Puntuación independiente de cada evaluador y consenso posterior; el puntaje refleja el semestre completo, no las últimas semanas (Manual, §11–12).</div>`
      : `<div class="notice n-ok"><b>Módulo firmado y bloqueado</b> (${M.fecha}).</div>`}
  <div class="card"><div class="frow">
    <div><label class="req">Fecha de cierre del protocolo</label><input type="date" ${ed?'':'disabled'} value="${M.fecha}" onchange="getP('${p.id}').${key}.fecha=this.value"></div>
    <div><label class="req">Semanas de asistencia efectiva (mín. 15)</label><input type="number" min="0" ${ed?'':'disabled'} value="${M.semanas}" onchange="getP('${p.id}').${key}.semanas=this.value"></div>
  </div>
  <div class="notice n-info">Escala Likert de progreso: <b>1</b> Regresión significativa · <b>2</b> Sin cambio · <b>3</b> Emergente · <b>4</b> Consistente · <b>5</b> Generalizado. Mide <b>progreso</b>, no severidad — lógica inversa al IDEA.</div></div>
  ${porEscala}
  <div class="card"><h3>Resultado ${esB?'Protocolo B':'Protocolo A'}</h3>
    <div class="grid4">${t.esc.map((v,i)=>`<div class="kpi"><div class="v">${v}<span style="font-size:.9rem;color:var(--ink-soft)"> / 30</span></div><div class="l">Escala E${i+1}</div></div>`).join('')}</div>
    <div class="notice ${t.completo?'n-info':'n-warn'}" style="margin-top:12px">${t.completo? `<b>Total IPPU-TEA: ${t.total} / 120</b>` : 'Hay ítems sin puntuar. Se requieren los 24 ítems para firmar.'}</div>
    <div class="frow" style="margin-top:10px">
      <div style="grid-column:1/-1"><label class="req">Síntesis del Técnico/a responsable 1 (mín. 150 palabras)</label><textarea ${ed?'':'disabled'} onchange="getP('${p.id}').${key}.sintPsi=this.value">${M.sintPsi||''}</textarea></div>
      <div style="grid-column:1/-1"><label class="req">Síntesis del Técnico/a responsable 2 (mín. 150 palabras)</label><textarea ${ed?'':'disabled'} onchange="getP('${p.id}').${key}.sintMtra=this.value">${M.sintMtra||''}</textarea></div>
      <div style="grid-column:1/-1"><label>Observaciones de otros técnicos (especificar disciplina)</label><textarea ${ed?'':'disabled'} onchange="getP('${p.id}').${key}.otros=this.value">${M.otros||''}</textarea></div>
      ${esB? `<div style="grid-column:1/-1"><label>Ajustes metodológicos realizados durante el período</label><textarea ${ed?'':'disabled'} onchange="getP('${p.id}').protB.ajustes=this.value">${M.ajustes||''}</textarea></div>`:''}
    </div>
    ${ed? `<div class="toolbar"><button class="btn ok" onclick="firmarProt('${p.id}','${key}')">Firmar módulo (técnicos responsables)</button>
    <span class="hint">La firma bloquea la edición y habilita ${esB?'el Informe de Cierre Anual':'el Protocolo B'}.</span></div>`:''}
  </div>
  ${deltaCard}`;
}
function deltaChip(d){return ` <span class="delta ${esign(d)}" style="margin-left:10px">Δ ${fmtDelta(d)}</span>`;}
function setProt(id,key,ix,v){ const p=getP(id); p[key].punt[ix] = (p[key].punt[ix]===v? null : v); setMod(key); }
function firmarProt(id,key){
  const p=getP(id); const M=p[key]; const t=protTotales(M.punt);
  // Integridad (duros)
  const err=[];
  if(!M.fecha) err.push('fecha de cierre');
  if(!t.completo) err.push('los 24 ítems puntuados');
  M.punt.forEach((v,ix)=>{ if((v===1||v===5) && !(M.obs[ix]||'').trim()) err.push('observación en el ítem '+(IPPU_ITEMS[ix].e+1)+'.'+IPPU_ITEMS[ix].i+' (los valores 1 y 5 requieren fundamentación)'); });
  if(!(M.sintPsi||'').trim()) err.push('síntesis del Técnico/a responsable 1');
  if(!(M.sintMtra||'').trim()) err.push('síntesis del Técnico/a responsable 2');
  if(err.length){alert('Para firmar se requiere completar:\n• '+err.join('\n• '));return;}
  // Recomendaciones (flexibles)
  const avisos=[];
  if(!M.semanas || +M.semanas<15) avisos.push('menos de 15 semanas de asistencia efectiva en el período (recomendado por el Manual)');
  if(!excepcionFlexible(p, key==='protA'?'HCE-PA':'HCE-PB', avisos)) return;
  M.estado='firmado';
  if(key==='protA' && p.protB.estado==='bloqueado') p.protB.estado='borrador';
  if(key==='protB' && p.cierre.estado==='bloqueado') p.cierre.estado='borrador';
  setMod(key); route();
}

/* ---- HCE-IC Informe de Cierre ---- */
function mCierre(p){
  if(p.cierre.estado==='bloqueado'){
    if(!(p.idea.estado==='firmado' && p.protA.estado==='firmado' && p.protB.estado==='firmado'))
      return bloqueadoMsg('El flujo sugerido indica tener IDEA, Protocolo A y Protocolo B firmados antes del Informe de Cierre (Manual, §16). Nota: la tabla comparativa y los deltas solo pueden calcularse con los instrumentos completos.') + habilitarBtn(p.id,'cierre','el Informe de Cierre');
    p.cierre.estado='borrador';
  }
  if(p.cierre.estado!=='borrador' && p.cierre.estado!=='firmado') return '';
  const ed = p.cierre.estado==='borrador';
  const ti = ideaTotales(p.idea.punt), ta = protTotales(p.protA.punt), tb = protTotales(p.protB.punt);
  const comp = ESCALAS.map((e,i)=>{
    const d = tb.esc[i]-ta.esc[i]; const di=deltaInterpreta(d);
    return `<tr><td>${e}</td><td class="num">${ti.esc[i]} / 24</td><td class="num">${ta.esc[i]} / 30</td><td class="num">${tb.esc[i]} / 30</td><td class="num"><span class="delta ${di.c}">${fmtDelta(d)}</span></td><td>${di.t}</td></tr>`;
  }).join('');
  const dT = tb.total-ta.total;
  return `
  ${ed? '<div class="notice n-warn"><b>Informe en borrador.</b> Plazo: 10 días hábiles tras el cierre del Protocolo B. Se comunica a la familia en entrevista presencial antes del cierre del año (Manual, §16 y §18).</div>'
      : '<div class="notice n-ok"><b>Informe firmado</b> ('+p.cierre.fecha+'). '+(p.cierre.recibi?'La familia firmó el "Recibí de informe".':'<b>Pendiente:</b> firma "Recibí" de la familia.')+' <a href="#/reportes/'+p.id+'">Ver versión imprimible →</a></div>'}
  <div class="card"><h3>Parte cuantitativa · Tabla comparativa anual</h3>
  <table><thead><tr><th>Escala</th><th class="num">IDEA (severidad)</th><th class="num">Prot. A (progreso)</th><th class="num">Prot. B (progreso)</th><th class="num">Δ B−A</th><th>Lectura</th></tr></thead>
  <tbody>${comp}
  <tr><td><b>Total</b></td><td class="num"><b>${ti.total} / 96</b></td><td class="num"><b>${ta.total} / 120</b></td><td class="num"><b>${tb.total} / 120</b></td><td class="num"><span class="delta ${esign(dT)}"><b>${fmtDelta(dT)}</b></span></td><td>${deltaInterpreta(dT).t}</td></tr></tbody></table>
  <div class="hint" style="margin-top:8px">Los puntajes IDEA e IPPU-TEA no son homologables entre sí; la comparación longitudinal es orientativa y se explicita en este informe (nota metodológica de los protocolos).</div>
  <div class="radarwrap" style="margin-top:14px">
    <div><div class="hint" style="text-align:center;font-weight:600">Perfil IDEA (severidad, línea base)</div>${radarSVG([{color:'#0e5a63',vals:ti.esc,max:24}],270)}</div>
    <div><div class="hint" style="text-align:center;font-weight:600">Progreso IPPU-TEA (A vs B)</div>${radarSVG([{color:'#b35c00',vals:ta.esc,max:30},{color:'#2e7d4f',vals:tb.esc,max:30}],270)}
    <div class="legend" style="text-align:center"><span><i style="background:#b35c00"></i>Protocolo A</span><span><i style="background:#2e7d4f"></i>Protocolo B</span></div></div>
  </div></div>
  <div class="card"><h3>Parte cualitativa · Síntesis por escala (mín. 100 palabras c/u)</h3>

    <div style="grid-column:1/-1"><label class="req">Valoración anual — Técnico/a responsable 2</label><textarea ${ed?'':'disabled'} onchange="getP('${p.id}').cierre.sintMtra=this.value">${p.cierre.sintMtra||''}</textarea></div>
    <div style="grid-column:1/-1"><label class="req">Recomendaciones y ajustes de tratamiento (mín. 3 objetivos por área)</label><textarea ${ed?'':'disabled'} onchange="getP('${p.id}').cierre.recomendaciones=this.value">${p.cierre.recomendaciones||''}</textarea></div>
    <div style="grid-column:1/-1"><label class="req">Orientaciones concretas a la familia</label><textarea ${ed?'':'disabled'} onchange="getP('${p.id}').cierre.orientaciones=this.value">${p.cierre.orientaciones||''}</textarea></div>
    <div><label class="req">Fecha del informe</label><input type="date" ${ed?'':'disabled'} value="${p.cierre.fecha}" onchange="getP('${p.id}').cierre.fecha=this.value"></div>
  </div>
  ${ed? `<div class="toolbar"><button class="btn ok" onclick="firmarCierre('${p.id}')">Firmar Informe de Cierre</button></div>`
      : (!p.cierre.recibi? `<div class="toolbar"><button class="btn" onclick="getP('${p.id}').cierre.recibi=true; setMod('cierre')">Registrar "Recibí" de la familia (entrevista realizada)</button></div>`:'')}
  </div>`;

function firmarCierre(id){
  const p=getP(id); const c=p.cierre; const err=[];
  if(!c.fecha) err.push('fecha del informe');
  c.sintE.forEach((s,i)=>{if(!(s||'').trim()) err.push('síntesis de la escala '+ESCALAS[i]);});
  if(!(c.sintPsi||'').trim()) err.push('valoración anual del Técnico/a responsable 1');
  if(!(c.sintMtra||'').trim()) err.push('valoración anual del Técnico/a responsable 2');
  if(!(c.recomendaciones||'').trim()) err.push('recomendaciones');
  if(!(c.orientaciones||'').trim()) err.push('orientaciones a la familia');
  if(err.length){alert('No se puede firmar. Falta:\n• '+err.join('\n• '));return;}
  c.estado='firmado'; setMod('cierre'); route();
}

/* ============ VISTA: REPORTES ============ */
function vReportes(pid){
  const conCierre = DB.pacientes.filter(p=>p.cierre.estado==='firmado');
  if(pid){ const p=getP(pid); if(p && p.cierre.estado==='firmado') return vInformeIndividual(p); }
  // --- Reporte general institucional ---
  const conB = DB.pacientes.filter(p=>p.protB.estado==='firmado');
  let promDeltas=[0,0,0,0], dTot=0;
  conB.forEach(p=>{const a=protTotales(p.protA.punt).esc, b=protTotales(p.protB.punt).esc;
    for(let i=0;i<4;i++) promDeltas[i]+= b[i]-a[i]; dTot += protTotales(p.protB.punt).total-protTotales(p.protA.punt).total;});
  if(conB.length){promDeltas=promDeltas.map(v=>+(v/conB.length).toFixed(1)); dTot=+(dTot/conB.length).toFixed(1);}
  const maxAbs = Math.max(3, ...promDeltas.map(Math.abs));
  const barras = ESCALAS.map((e,i)=>{
    const v=promDeltas[i]; const w=Math.abs(v)/maxAbs*100;
    return `<tr><td style="width:220px">${e}</td>
    <td><div style="background:#eef2f1;border-radius:5px;height:20px;position:relative">
      <div style="position:absolute;left:${v>=0?50:50-w/2}%;width:${w/2}%;height:100%;border-radius:4px;background:${v>=0?'var(--ok)':'var(--danger)'}"></div>
      <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#9fb0ad"></div></div></td>
    <td class="num" style="width:70px"><span class="delta ${esign(v)}">${fmtDelta(v)}</span></td></tr>`;

    const pl=pipeline(p);
    const done=pl.filter(s=>s.st==='firmado').length;

    <td class="num">${done}/5</td>
    <td>${p.cierre.estado==='firmado'? '<a href="#/reportes/'+p.id+'">Informe anual →</a>':'<span class="hint">—</span>'}</td></tr>`;
  }).join('');
  return `
  <div class="crumb">Servicio de Atención Diurna</div>
  <div class="pagehead"><div><h2>Reportes</h2>
  <p>Reportes individuales (Informe de Cierre Anual imprimible) y visión general institucional: progreso promedio por escala, cumplimiento del flujo y disponibilidad de informes para INAU, BPS y MSP.</p></div></div>
  <div class="card"><h3>Progreso institucional — Δ promedio por escala (ciclos con Protocolo B firmado: ${conB.length})</h3>
  ${conB.length? `<table><tbody>${barras}<tr><td><b>Δ total promedio</b></td><td></td><td class="num"><span class="delta ${esign(dTot)}"><b>${fmtDelta(dTot)}</b></span></td></tr></tbody></table>
  <div class="hint" style="margin-top:8px">El sistema mide el progreso, no su causa: el avance puede deberse a la intervención, la maduración, cambios de medicación u otros factores (Manual, §15.2, Error 2).</div>`
  : '<div class="notice n-info">Aún no hay ciclos con Protocolo B firmado en el período seleccionado.</div>'}
  </div>
  <div class="card"><h3>Cumplimiento del flujo por usuario</h3>
  <table><thead><tr><th>Usuario</th><th>Grupo</th><th>Módulos</th><th class="num">Firmados</th><th>Informe</th></tr></thead><tbody>${cumpl}</tbody></table></div>
  <div class="card"><h3>Reportes de Valoración Funcional para la familia (descriptivos, generables en cualquier momento)</h3>
  ${DB.pacientes.filter(p=>p.idea.estado==='firmado' || (p.vf && ((p.vf.capacidades||'').trim() || (p.vf.sintesisFuncional||'').trim()))).map(p=>`<div class="notice n-info" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span><b>${p.nombre}</b> · ${p.grupo}</span><a class="btn ghost" style="padding:6px 14px" href="#/reportes/vf/${p.id}">Abrir / imprimir</a></div>`).join('') || '<div class="notice n-info">Se habilita al contar con la línea base IDEA firmada o con contenido en HCE-VF.</div>'}

/* ============ VISTA: ESPECIFICACIONES PARA UTEC ============ */
function vSpecs(){
  return `
  <div class="crumb">Documentación técnica</div>
  <div class="pagehead"><div><h2>Especificaciones técnicas para el equipo UTEC-LIDIA</h2>
  <p>Resumen de reglas de negocio, modelo de datos y validaciones que este prototipo implementa y que el sistema definitivo debe respetar. Fuente normativa: Manual de Procedimientos v1.0 (consultable en la sección Manual).</p></div></div>

  <div class="card"><h3>1. Arquitectura general</h3>
  <ul style="padding-left:20px;font-size:.9rem;line-height:1.9">
    <li><b>Tres servicios, una identidad:</b> Atención Diurna (este prototipo), Taller Terapéutico y Clínica (fase 2). Cada persona tiene una identidad única institucional y puede tener registros en varios servicios.</li>
    <li><b>Módulos por HCE (Atención Diurna):</b> HCE-00 (datos generales/anamnesis, siempre actualizable), HCE-CI, HCE-LB (IDEA), HCE-PA, HCE-PB, HCE-IC, HCE-DOC (documentos adjuntos y fotografías individuales), HCE-ORG (áreas INAU y BPS por NNA), HCE-VF (valoración funcional BUND/CIF y guía de prestaciones), HCE-LOG (auditoría automática, solo lectura).</li>
    <li><b>HCE-VF — principios de diseño:</b> (a) IPPU registra la valoración oficial (BUND — Ley N.º 20.378, Decreto 72/025), no certifica; (b) el perfil funcional CIF es una síntesis breve de capacidades/autonomía/barreras/apoyos que sirve al equipo y como insumo del IBMF/IRSA cuando la familia lo gestiona — no duplica los instrumentos clínicos; (c) la guía de prestaciones es contenido informativo estático mantenido por coordinación, sin flujos de expedientes; (d) <u>prohibido</u> autocalcular la categoría del baremo desde puntajes IDEA/IPPU-TEA — constructos no equivalentes; (e) los rangos de categorización se implementan como tabla configurable, a validar contra la reglamentación vigente del Consejo Asesor; (f) alerta única: vencimiento/revisión de la valoración (90/30 días); (g) <b>autogeneración descriptiva:</b> el módulo construye un borrador de síntesis funcional en lenguaje natural a partir del perfil IDEA por escala y de la evolución cualitativa de los protocolos (nunca números crudos ni porcentajes), y sugiere niveles de autonomía editables solo en los tres dominios con correlato clínico (comunicación ← E2, interacciones ← E1, aprendizaje ← E4); el borrador siempre exige revisión de los técnicos responsables antes de compartirse; (h) <b>Reporte de Valoración Funcional autónomo:</b> documento imprimible para la familia, generable a demanda desde la HCE, de carácter descriptivo (capacidades, autonomía en palabras, evolución cualitativa del año, barreras y apoyos, estado de la valoración oficial y orientación de prestaciones), con la aclaración expresa de que no es certificado ni informe clínico.</li>
    <li><b>Búsqueda de HCE por tres vías:</b> cédula de identidad, N.º de HCE o grupo de referencia (también por nombre). Índices de base de datos sobre esos tres campos.</li>
    <li><b>El grupo como unidad de atención:</b> entidad «grupo de referencia» con técnicos responsables asignados, integrantes, y registro fotográfico grupal propio. Navegación grupo → NNA → HCE.</li>
    <li><b>Portabilidad institucional (criterio transversal):</b> la herramienta no presupone el modelo de trabajo de IPPU. Los roles se implementan de forma genérica como «Técnico/a responsable 1 y 2» con etiqueta de rol configurable por institución. El único requisito metodológico invariante es que sean <u>dos evaluadores que puntúan de forma independiente y luego consensúan</u> — base del control de confiabilidad interjueces (kappa). IPPU los instancia como Psicólogo/a + Maestro/a del grupo; otra institución podría instanciarlos como Psiquiatra + Terapeuta Ocupacional, Fonoaudiólogo/a + Educador/a, etc., sin tocar el sistema.</li>
    <li><b>Fotografías:</b> individuales (en HCE-DOC) y grupales (en la entidad grupo). Regla dura: la carga individual requiere autorización de uso de imagen registrada; la carga grupal requiere autorización de <u>todas</u> las familias del grupo (art. 11, CNA — Ley N.º 17.823). Almacenamiento cifrado y marca de agua institucional recomendada en exportaciones.</li>
    <li><b>HCE-ORG:</b> por NNA, área INAU (N.º SIPI, convenio, referente territorial, registro de informes enviados) y área BPS (prestación, N.º de trámite, estado, vencimiento, registro de gestiones). Alertas de vencimiento de AYEX (60/30 días) y de informes semestrales pendientes de envío.</li>
    <li><b>Flujo secuencial guiado, no impuesto:</b> el orden CI → LB → PA → PB → IC es el camino por defecto, pero todo módulo puede habilitarse fuera de secuencia mediante <b>habilitación excepcional con constancia obligatoria</b> registrada en HCE-LOG (ingresos tardíos, reingresos, licencias, situaciones familiares). Única excepción sin salvedad: el consentimiento informado, que es requisito legal.</li>
    <li><b>Plazos como recordatorios, nunca como bloqueos:</b> las ventanas del Manual (receso de julio, cierre lectivo, días posteriores al Protocolo B) se implementan como recordatorios configurables por coordinación. Los mínimos recomendados (5 sesiones de observación, 15 semanas de asistencia) generan una advertencia y piden constancia del motivo, pero no impiden firmar.</li>
    <li><b>Terminología cuidada hacia las familias (regla transversal de UI y de informes):</b> en pantallas, informes PDF y textos generados se emplea siempre «severo / muy severo» o «alta necesidad de apoyo»; nunca «grave / muy grave». Aplicar como constante de vocabulario del sistema para que ningún módulo futuro la contradiga.</li>
    <li><b>Neutralidad metodológica:</b> el sistema no prescribe técnicas ni métodos de intervención. Las lecturas orientativas aluden exclusivamente a las escalas y dimensiones del IDEA; la elección del abordaje corresponde a cada profesional según su formación. Las citas bibliográficas de los ítems de la Escala IPPU-TEA se mantienen como referencia documental, no como indicación.</li>
    <li><b>Firma digital = bloqueo:</b> un módulo firmado no se edita; correcciones solo por addenda con fecha, profesional y justificación.</li>
  </ul></div>

  <div class="card"><h3>2. Reglas de validación por módulo</h3>
  <table><thead><tr><th>Módulo</th><th>Validaciones para permitir la firma</th></tr></thead><tbody>
  <tr><td><b>HCE-LB (IDEA)</b></td><td><u>Integridad (requeridos):</u> 12 dimensiones puntuadas (0–8, impares permitidos; sin NS pendientes) · fecha · síntesis clínica · objetivos · totales automáticos (por escala 0–24, total 0–96). <u>Recomendados (advierten y piden constancia, no bloquean):</u> ≥5 sesiones de observación · extensión sugerida de la síntesis. Campo «migrado del sistema anterior» disponible.</td></tr>
  <tr><td><b>HCE-PA / HCE-PB</b></td><td><u>Integridad:</u> 24 ítems puntuados (Likert 1–5) · fecha · <b>fundamentación en todo ítem con valor 1 o 5</b> · síntesis de ambos técnicos responsables · totales por escala 6–30, total 24–120. <u>Recomendados:</u> ≥15 semanas de asistencia efectiva · extensión sugerida de las síntesis.</td></tr>
  <tr><td><b>HCE-PB (adicional)</b></td><td>Cálculo automático de Δ por escala (B−A, rango −24 a +24) y Δ total (−96 a +96). El Δ jamás se calcula contra el IDEA. Δ ≤ −7 en una escala debe disparar alerta institucional.</td></tr>
  <tr><td><b>HCE-IC</b></td><td>Requiere LB, PA y PB firmados · tabla comparativa y radar autogenerados · síntesis por escala ≥100 palabras c/u · valoraciones interdisciplinarias · recomendaciones y orientaciones · firma de ambos técnicos responsables + registro de "Recibí" de la familia · exportación PDF con membrete = documento clínico legal, versión única.</td></tr>
  </tbody></table></div>

  <div class="card"><h3>3. Modelo de datos (esquema sugerido)</h3>
  <pre style="background:#f2f5f4;border:1px solid var(--line);border-radius:8px;padding:14px;font-size:.78rem;overflow-x:auto">persona { id, nombre, fnac, ci, sexo, servicio[s] }
hce_diurna { persona_id, hc, grupo_id, anio,
             tecnico1_id, tecnico1_rol, tecnico2_id, tecnico2_rol,
             diag, cie11, nivel_soporte, anamnesis{...} }
-- roles genéricos: cada institución define las etiquetas de rol
-- (IPPU: tecnico1_rol='Psicólogo/a', tecnico2_rol='Maestro/a')
consentimiento { hce_id, firmante, fecha, adjunto_id, estado }
idea { hce_id, fecha, sesiones_obs, dim[12]{valor 0-8|NS, obs},
       totales calculados, sintesis, objetivos, firmas[2], estado }
protocolo { hce_id, tipo A|B, fecha, semanas, item[24]{valor 1-5, obs},
            totales, sint_psi, sint_mtra, otros_tecnicos, ajustes(B),
            deltas(B, calculados), firmas[2], estado }
informe_cierre { hce_id, fecha, sint_escala[4], sint_psi, sint_mtra,
                 recomendaciones, orientaciones, recibi_familia,
                 pdf_generado_id, firmas[2], estado }
auditoria { hce_id, usuario, timestamp, modulo, campo, valor_ant, valor_nuevo }</pre></div>

  <div class="card"><h3>4. Permisos (Manual, §21.1)</h3>
  <table><thead><tr><th>Perfil</th><th>Permitido</th><th>Denegado</th></tr></thead><tbody>
  <tr><td>Técnicos responsables del grupo</td><td>HCE completa de su grupo; escritura en módulos habilitados</td><td>HCE de otros grupos; historial de cambios</td></tr>
  <tr><td>Otros técnicos</td><td>Campos de texto libre de PA, PB e IC donde participan</td><td>Puntajes Likert; síntesis clínica; identificación</td></tr>
  <tr><td>Coordinación</td><td>Lectura de módulos firmados de todos los grupos; escritura en HCE-00</td><td>Modificar módulos firmados</td></tr>
  <tr><td>Dirección / administración</td><td>Estadísticos agregados sin identificación; cumplimiento de plazos</td><td>HCE individuales</td></tr>
  </tbody></table></div>

  <div class="card"><h3>5. Migración desde la HCE actual de IPPU</h3>
  <div class="hint" style="margin-bottom:10px">La Fundación ya cuenta con una HCE en uso. El único componente semánticamente equivalente entre ambos sistemas es el IDEA; los demás registros (Evaluación por áreas, Evaluación General, Observaciones) tienen formatos distintos y no deben forzarse a los campos del sistema nuevo.</div>
  <table><thead><tr><th>Componente del sistema actual</th><th>Estrategia de migración</th></tr></thead><tbody>
  <tr><td><b>IDEA (línea base)</b></td><td><b>Migración estructurada:</b> los 12 puntajes dimensionales se cargan al módulo HCE-LB con marca de origen «migrado del sistema anterior», fecha original de aplicación y verificación contra el registro fuente (doble control por muestreo). El documento original se adjunta en HCE-DOC.</td></tr>
  <tr><td><b>Evaluación por áreas · Evaluación General · Observaciones</b></td><td><b>Archivo histórico de solo lectura (legacy archive):</b> se exportan del sistema actual como documentos (PDF con firma o exportación certificada), se cargan en HCE-DOC con categorías específicas de «Registro histórico — HCE anterior» y fecha original. Quedan consultables desde la HCE del NNA pero nunca editables ni mapeados a campos estructurados. La no equivalencia entre sistemas queda declarada de forma explícita.</td></tr>
  <tr><td><b>Datos identificatorios (HCE-00)</b></td><td>Migración estructurada con validación de duplicados por CI y N.º de HCE. Se preserva el N.º de HCE histórico como identificador secundario.</td></tr>
  </tbody></table>
  <h3 style="margin-top:14px">Procedimiento estándar de cambio de sistema en instituciones de salud</h3>
  <ol style="padding-left:20px;font-size:.9rem;line-height:1.8">
    <li><b>Inventario y clasificación</b> de los registros del sistema actual: qué migra estructurado, qué se archiva como histórico, qué se descarta (nada clínico se descarta).</li>
    <li><b>Fecha de corte definida:</b> a partir de ella, todo registro nuevo se hace en el sistema nuevo. El sistema anterior pasa a modo de solo lectura.</li>
    <li><b>Período de coexistencia acotado</b> (habitualmente semanas, no meses) con el sistema anterior consultable, para resolver dudas y verificar la migración.</li>
    <li><b>Verificación por muestreo:</b> un porcentaje de historias migradas se coteja campo a campo contra el original, con acta de verificación firmada.</li>
    <li><b>Acta de cierre del sistema anterior:</b> documento institucional que deja constancia de qué se migró, cómo, quién lo verificó, y dónde queda resguardado el respaldo íntegro del sistema anterior.</li>
    <li><b>Conservación del respaldo completo</b> del sistema anterior (base de datos + documentos) durante los plazos que exige la normativa vigente sobre historias clínicas, aunque ya no se use operativamente.</li>
    <li><b>Trazabilidad:</b> cada registro migrado conserva metadatos de origen (sistema, fecha original, fecha de migración, responsable).</li>
  </ol>
  <div class="notice n-info"><b>Contexto normativo uruguayo:</b> el Decreto N.º 242/017 y sus ordenanzas reglamentarias (MSP/AGESIC, programa Salud.uy) establecen la Historia Clínica Electrónica Nacional (HCEN) y sus principios: finalidad, veracidad, completitud, reserva, información y accesibilidad. Aunque el alcance de IPPU respecto de la HCEN debe confirmarse con el MSP según su naturaleza institucional, conviene que el sistema nuevo se diseñe alineado a esos principios y a los estándares de documento clínico electrónico, lo que además facilitaría una eventual integración futura.</div></div>

  <div class="card"><h3>6. Requisitos no funcionales</h3>
  <ul style="padding-left:20px;font-size:.9rem;line-height:1.9">
    <li>Cumplimiento Ley N.º 18.331/2008 (datos sensibles: cifrado en reposo y en tránsito, consentimiento explícito) y Ley N.º 18.335/2008 (derecho de acceso de la familia por solicitud formal).</li>
    <li>Autenticación con roles; sesión con expiración; registro de auditoría inalterable (HCE-LOG).</li>
    <li>Cálculo automático de totales y deltas con verificación visible por el evaluador antes de firmar (Anexo A del Manual).</li>
    <li>Generación de PDF del Informe de Cierre con membrete y firma digital.</li>
    <li>Módulo de confiabilidad interjueces (fase piloto): captura de puntuaciones independientes por evaluador y cálculo de kappa de Cohen por ítem; alertas con κ &lt; 0,61 (Manual, §23).</li>
    <li>Alertas de plazos: IDEA en semanas 2–3 del ingreso; PA en receso de julio; PB en última semana lectiva; IC dentro de 10 días hábiles.</li>
  </ul>
  <div class="notice n-warn"><b>Diferencias deliberadas del prototipo respecto del sistema definitivo:</b> sin persistencia (los datos viven en memoria del navegador), sin autenticación, firma simulada con un botón, umbrales de extensión reducidos para poder demostrar el flujo, kappa interjueces no implementado (solo especificado), y documentos/fotos disponibles solo durante la sesión del navegador (sin almacenamiento). Las habilitaciones excepcionales y las constancias de excepción están implementadas y pueden probarse en cualquier módulo no habilitado.</div></div>`;
}

function vManual(){
  const filtro = UI.mfiltro.toLowerCase();
  const secs = MANUAL.filter(s=>!filtro || (s.t+' '+s.h).toLowerCase().includes(filtro));
  let toc='', lastG='';
  MANUAL.forEach(s=>{ if(s.g!==lastG){toc+='<div class="g">'+s.g+'</div>'; lastG=s.g;} toc+='<a href="#/manual" onclick="setTimeout(()=>document.getElementById(\''+s.id+'\')?.scrollIntoView({behavior:\'smooth\'}),50)">'+s.t+'</a>'; });
  return `
  <div class="crumb">Documentación</div>
  <div class="pagehead"><div><h2>Manual de Procedimientos — consulta rápida</h2>
  <p>Versión de consulta del Manual de Procedimientos v1.0 (Sistema Integrado de Evaluación y Seguimiento TEA). El documento normativo completo en PDF se adjunta en HCE-DOC institucional. Nota: en esta herramienta se utiliza la denominación genérica «técnicos responsables»; cada institución que adopte el sistema instancia los roles según su propio modelo de trabajo.</p></div></div>
  <div class="card no-print"><input type="text" placeholder="Buscar en el manual (ej.: kappa, delta, consentimiento, plazos)…" value="${UI.mfiltro}" oninput="UI.mfiltro=this.value; document.getElementById('main').innerHTML=vManual()"></div>
  <div class="manual">
    <div class="mtoc card" style="padding:10px">${toc}</div>
    <div class="mbody">${secs.length? secs.map(s=>'<div class="card" id="'+s.id+'"><h3 style="margin-top:0;border:none;padding-top:0">'+s.t+'</h3><div class="hint" style="margin-bottom:8px">'+s.g+'</div>'+s.h+'</div>').join('') : '<div class="notice n-info">No se encontraron secciones para «'+UI.mfiltro+'».</div>'}</div>
  </div>`;
}

function mDocs(p){
  const cats=['Informe médico externo','Informe escolar','Evaluación externa (otra institución)','Documento INAU','Documento BPS','Autorización / consentimiento','Estudio complementario',
    'Registro histórico — HCE anterior (Evaluación por áreas)','Registro histórico — HCE anterior (Evaluación General)','Registro histórico — HCE anterior (Observaciones)','Registro histórico — HCE anterior (otro)','Otro'];
  const rows = p.docs.length? p.docs.map((d,i)=>`<tr><td>${d.url? '<a href="'+d.url+'" target="_blank">'+d.nombre+'</a>' : d.nombre}</td><td>${d.cat}</td><td>${d.fecha}</td><td>${d.url? '<a href="'+d.url+'" target="_blank">Ver</a>' : '<span class="hint">demo</span>'} · <a href="javascript:void(0)" onclick="quitarDoc('${p.id}',${i})" style="color:var(--danger)">Quitar</a></td></tr>`).join('')
    : '<tr><td colspan="4"><div class="notice n-info" style="margin:6px 0">Aún no hay documentos adjuntos en esta HCE.</div></td></tr>';
  const fotos = p.fotos.length? p.fotos.map((ft,i)=>`<div class="thumb"><img src="${ft.url}" alt=""><div class="cap">${ft.desc||'Sin descripción'} · ${ft.fecha}<br><a href="javascript:void(0)" onclick="quitarFoto('${p.id}',${i})" style="color:var(--danger)">Quitar</a></div></div>`).join('')
    : '<div class="notice n-info" style="margin-top:10px">Sin fotografías individuales registradas.</div>';
  return `
  <div class="card"><h3>HCE-DOC · Documentos adjuntos</h3>
  <div class="hint" style="margin-bottom:10px">Repositorio de copias digitalizadas: informes externos (médicos, escolares, de otras instituciones), documentación de organismos, autorizaciones y estudios. Los documentos externos contextualizan pero <b>no reemplazan</b> la línea base propia de IPPU (Manual, §5.2).</div>
  <div class="notice n-info"><b>Registros de la HCE anterior de IPPU:</b> los registros del sistema previo (Evaluación por áreas, Evaluación General, Observaciones) se incorporan aquí como <b>archivo histórico de solo lectura</b>, con su categoría específica y fecha original. No se traducen a los campos estructurados del nuevo sistema porque sus formatos no son equivalentes. La única excepción es el IDEA, que por ser el mismo instrumento migra de forma estructurada al módulo HCE-LB (ver Especificaciones técnicas, §6).</div>
  <table><thead><tr><th>Documento</th><th>Categoría</th><th>Fecha de carga</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  <div class="uprow no-print">
    <div><label>Archivo (PDF, imagen, Word)</label><input type="file" id="doc_file" accept=".pdf,.doc,.docx,image/*"></div>
    <div><label>Categoría</label><select id="doc_cat">${cats.map(c=>'<option>'+c+'</option>').join('')}</select></div>
    <div style="flex:0"><button class="btn" onclick="subirDoc('${p.id}')">Adjuntar</button></div>
  </div>
  <div class="hint" style="margin-top:6px">En el sistema definitivo: almacenamiento cifrado, control de versiones y registro en HCE-LOG de cada carga y descarga. En el prototipo el archivo queda disponible solo durante la sesión del navegador.</div></div>

  <div class="card"><h3>Fotografías individuales</h3>
  <div class="notice ${p.fotoConsent?'n-ok':'n-warn'}">
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:.86rem;font-weight:400;cursor:pointer">
    <input type="checkbox" style="width:auto" ${p.fotoConsent?'checked':''} onchange="getP('${p.id}').fotoConsent=this.checked; setMod('docs')">
    <span><b>Autorización de uso de imagen registrada.</b> La familia firmó la autorización escrita (adjuntar copia en Documentos, categoría «Autorización / consentimiento»). Sin este registro no se pueden cargar fotografías — protección de la imagen de NNA (art. 11, Código de la Niñez y la Adolescencia, Ley N.º 17.823; Ley N.º 18.331/2008).</span></label></div>
  ${p.fotoConsent? `<div class="uprow no-print">
    <div><label>Fotografía</label><input type="file" id="foto_file" accept="image/*"></div>
    <div><label>Descripción / contexto</label><input type="text" id="foto_desc" placeholder="Ej.: actividad de juego estructurado, taller de cocina…"></div>
    <div style="flex:0"><button class="btn" onclick="subirFoto('${p.id}')">Cargar foto</button></div>
  </div>` : '<div class="hint">La carga de fotografías está deshabilitada hasta registrar la autorización.</div>'}
  <div class="thumbs">${fotos}</div></div>`;
}
function subirDoc(id){
  const inp=document.getElementById('doc_file'), cat=document.getElementById('doc_cat').value;
  if(!inp.files.length){alert('Seleccione un archivo.');return;}
  const f=inp.files[0];
  getP(id).docs.push({nombre:f.name, cat, fecha:new Date().toISOString().slice(0,10), url:URL.createObjectURL(f)});
  setMod('docs');
}
function quitarDoc(id,i){ if(confirm('¿Quitar este documento de la HCE? (En el sistema definitivo esta acción queda registrada en HCE-LOG.)')){ getP(id).docs.splice(i,1); setMod('docs'); } }
function subirFoto(id){
  const inp=document.getElementById('foto_file'), desc=document.getElementById('foto_desc').value;
  if(!inp.files.length){alert('Seleccione una imagen.');return;}
  const f=inp.files[0];
  getP(id).fotos.push({url:URL.createObjectURL(f), desc, fecha:new Date().toISOString().slice(0,10)});
  setMod('docs');
}
function quitarFoto(id,i){ if(confirm('¿Quitar esta fotografía?')){ getP(id).fotos.splice(i,1); setMod('docs'); } }

/* ============ HCE-ORG: ÁREAS INAU Y BPS ============ */

      <div><label>N.º de trámite / expediente</label><input type="text" value="${B.tramite}" onchange="getP('${p.id}').bps.tramite=this.value"></div>
      <div><label>Estado</label><select onchange="getP('${p.id}').bps.estado=this.value">${['','Vigente','En trámite','Observada','Vencida','Denegada','No corresponde'].map(c=>'<option '+(B.estado===c?'selected':'')+'>'+c+'</option>').join('')}</select></div>
      <div><label>Vencimiento / renovación</label><input type="date" value="${B.vencimiento}" onchange="getP('${p.id}').bps.vencimiento=this.value"></div>
      <div style="grid-column:1/-1"><label>Observaciones (documentación, constancias, recordatorios)</label><textarea onchange="getP('${p.id}').bps.obs=this.value">${B.obs}</textarea></div>
    </div>
    <h3 style="font-size:.95rem">Gestiones realizadas ante BPS</h3>

    <div class="uprow no-print">
      <div style="flex:0;min-width:150px"><label>Fecha</label><input type="date" id="bps_f" value="2026-07-12"></div>
      <div><label>Detalle</label><input type="text" id="bps_t" placeholder="Ej.: constancia de asistencia emitida, renovación presentada…"></div>
      <div style="flex:0"><button class="btn" onclick="agregarReg('${p.id}','bps')">Registrar</button></div>
    </div></div>
